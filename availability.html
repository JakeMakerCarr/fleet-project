<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fleet Availability Calendar</title>

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #5cbde5;
      min-height: 100vh;
    }
    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    #container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.25rem 2rem;
      box-sizing: border-box;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }
    #legend {
      width: 260px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }
    .legend-color {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex: 0 0 22px;
    }
    #rightPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #topPanel {
      display: flex;
      gap: 20px;
    }
    #calendar {
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);

      /* new: limit height and scroll */
      max-height: 75vh;
      overflow-y: auto;
    }
    #bottomGasCards {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.08);
    }
    #bottomGasCards h3 {
      margin: 0 0 12px;
    }
    #gasCardList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .gas-card-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f7f8fa;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }
    .gas-card-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex: 0 0 16px;
    }
    #dateInfo {
      flex: 1;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.08);

      /* new: limit height and scroll */
      max-height: 75vh;
      overflow-y: auto;
    }
    .available-box {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      color: white;
    }
    /* hide events */
    .fc .fc-daygrid-event-harness,
    .fc .fc-daygrid-event {
      display: none !important;
    }
    /* only the event container scrolls */
    .fc .fc-daygrid-day-events {
      max-height: 100px;
      overflow-y: auto;
    }
    /* highlight selected day cell */
    .fc .fc-daygrid-day.selected-day {
      background-color: rgba(255, 235, 59, 0.3);
    }
    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }
      body.live-feather-background .feather-canvas {
        display: block;
      }
    }
  </style>
</head>
<body>
  <canvas id="feather-canvas" class="feather-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="header-left">
      <div class="header-logo-box">
        <img src="YFNED_fleet_logo_navy.svg" alt="YFNED Fleet logo" />
      </div>
      <div class="header-title">YFNED Availability Calendar</div>
    </div>
    <div class="header-nav">
      <button class="header-btn" onclick="location.href='fleetmaster.html'">Fleetmaster View</button>
      <button class="header-btn" onclick="location.href='mastercalendar.html'">Master Calendar</button>
      <button class="header-btn active" aria-current="page" onclick="location.href='availability.html'">Availability Calendar</button>
      <button class="header-btn" onclick="location.href='masterbooking.html'">Master Booking</button>
      <button class="header-btn" onclick="location.href='records.html'">Records</button>
      <button id="logout-btn" class="header-btn">Logout</button>
    </div>
  </header>


  <div id="container">
    <div id="legend"></div>
    <div id="rightPanel">
      <div id="topPanel">
        <div id="calendar"></div>
        <div id="dateInfo">Click a date to view availability.</div>
      </div>
      <div id="bottomGasCards">
        <h3>Vehicle Gas Cards</h3>
        <div id="gasCardList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="livefeathers.js"></script>
  <script type="module">
    import { initializeApp }           from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, get }   from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut }
                                        from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // Firebase init
    const app = initializeApp({
      apiKey: "AIzaSyAjnCWLnUf8msIUjL0TBdZ1eCAiXMLOwvU",
      authDomain: "yfned-fleet-nfc.firebaseapp.com",
      databaseURL: "https://yfned-fleet-nfc-default-rtdb.firebaseio.com",
      projectId: "yfned-fleet-nfc",
      storageBucket: "yfned-fleet-nfc.appspot.com",
      messagingSenderId: "482363667898",
      appId: "1:482363667898:web:4b0364e891a221e9631983"
    });
    const auth = getAuth(app);
    const db   = getDatabase(app);
    window.initLiveFeatherBackground();

    // vehicle→color map
    const vehicleColors = {
      "01-20 2021 Red Traverse CM335": "#d4282f",
      "02-20 2021 Black Traverse CM366": "#2c3e50",
      "03-21 2021 Grey Traverse CN360 Nutrition Team Only": "#690000ff",
      "04-21 2021 Shadow Silverado 1500 CM695": "#f1c40f",
      "06-21 2020 Grey Grand Caravan CN468 Early Years Only": "#ff009dff",
      "07-21 2021 White Terrain CN466 Early Years Only": "#c83771ff",
      "08-21 2021 Black Terrain CN467 Early Years Only": "#ff7299ff",
      "10-24 2025 Green MTU Trailblazer C838B": "#27ae60",
      "11-24 2024 Grey Traverse CS266": "#303030ff",
      "13-24 2024 Grey Traverse CT008": "#5e5e5eff",
      "14-24 2024 Grey Traverse C443C": "#919191ff",
      "15-24 2024 Grey Traverse C444C": "#c6c6c6ff",
      "16-24 2024 Blue Traverse CT073": "#0055d4ff",
      "17-25 2025 Black Buick Envision CV294": "#8e44ad",
      "18-25 2025 Ford Transit Van - C115C": "#fd9644"
    };
    const VEHICLE_EXPORT_LABELS = {
      "01-20 2021 Red Traverse CM335": "Red Traverse CM335",
      "02-20 2021 Black Traverse CM366": "Black Traverse CM366",
      "03-21 2021 Grey Traverse CN360": "Grey Traverse CN360",
      "03-21 2021 Grey Traverse CN360 Nutrition Team Only": "Grey Traverse CN360",
      "04-21 2021 Shadow Silverado 1500 CM695": "Shadow Silverado CM695",
      "06-21 2020 Grey Grand Caravan CN468": "Grey Grand Caravan CN468",
      "06-21 2020 Grey Grand Caravan CN468 Early Years Only": "Grey Grand Caravan CN468",
      "07-21 2021 White Terrain CN466": "White Terrain CN466",
      "07-21 2021 White Terrain CN466 Early Years Only": "White Terrain CN466",
      "08-21 2021 Black Terrain CN467": "Black Terrain CN467",
      "08-21 2021 Black Terrain CN467 Early Years Only": "Black Terrain CN467",
      "10-24 2025 Green MTU Trailblazer C838B": "Green Trailblazer C838B",
      "10-24 2025 Green Trailblazer C838B": "Green Trailblazer C838B",
      "11-24 2024 Grey Traverse CS266": "Grey Traverse CS266",
      "13-24 2024 Grey Traverse CT008": "Grey Traverse CT008",
      "14-24 2024 Grey Traverse C443C": "Grey Traverse C443C",
      "15-24 2024 Grey Traverse C444C": "Grey Traverse C444C",
      "16-24 2024 Blue Traverse CT073": "Blue Traverse CT073",
      "17-25 2025 Black Buick Envision CV294": "Black Buick Envision CV294",
      "18-25 2025 Ford Transit Van C115C": "Ford Transit Van C115C",
      "18-25 2025 Ford Transit Van - C115C": "Ford Transit Van C115C"
    };
    // vehicle→gas cards→color map for bottom section
    const vehicleGasCardColors = {
      "Red Traverse CM335 Gas Card:55221": "#d4282f",
      "Black Traverse CM366 Gas Card:67474": "#2c3e50",
      "Grey Traverse CN360 Nutrition Team Only Gas Card:60555": "#690000ff",
      "Shadow Silverado 1500 CM695 Gas Card:67479": "#f1c40f",
      "Grey Grand Caravan CN468 Early Years Only Gas Card:3489": "#ff009dff",
      "White Terrain CN466 Early Years Only Gas Card:55224": "#c83771ff",
      "Black Terrain CN467 Early Years Only Gas Card:67477": "#ff7299ff",
      "Green MTU Trailblazer C838B Gas Card:67121": "#27ae60",
      "Grey Traverse CS266 Gas Card:7480": "#303030ff",
      "Grey Traverse CT008 Gas Card:7122": "#5e5e5eff",
      "Grey Traverse C443C Gas Card:67473": "#919191ff",
      "Grey Traverse C444C Gas Card:67472": "#c6c6c6ff",
      "Blue Traverse CT073 Gas Card:67476": "#0055d4ff",
      "Black Buick Envision CV294 Gas Card:68661 Gas Card:?": "#8e44ad",
      "Ford Transit Van - C115C": "#fd9644"
    };

    let allBookings = [];
    let lastClickedDayEl = null;

    function getVehicleExportLabel(vehicle) {
      return VEHICLE_EXPORT_LABELS[vehicle] || vehicle;
    }

    function renderLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      for (const [veh, color] of Object.entries(vehicleColors)) {
        const div = document.createElement("div");
        div.className = "legend-item";
        div.innerHTML = `<div class="legend-color" style="background:${color}"></div>${getVehicleExportLabel(veh)}`;
        legend.appendChild(div);
      }
    }

    function renderBottomGasCards() {
      const gasCardList = document.getElementById("gasCardList");
      gasCardList.innerHTML = "";

      for (const [vehicle, color] of Object.entries(vehicleGasCardColors)) {
        const row = document.createElement("div");
        row.className = "gas-card-item";
        row.innerHTML = `
          <div class="gas-card-color" style="background:${color}"></div>
          <span>${vehicle}</span>
        `;
        gasCardList.appendChild(row);
      }
    }

    async function fetchAllBookings() {
      const snap = await get(ref(db, 'bookings'));
      if (!snap.exists()) return [];
      const events = [];
      snap.forEach(vehicleSnap => {
        const name = vehicleSnap.key;
        vehicleSnap.forEach(bSnap => {
          const b = bSnap.val();
          events.push({
            start: b.startTimeISO,
            end:   b.endTimeISO,
            extendedProps: { vehicle: name }
          });
        });
      });
      return events;
    }

    function renderCalendar(events) {
      const calendar = new FullCalendar.Calendar(
        document.getElementById("calendar"),
        {
          initialView: 'dayGridMonth',
          headerToolbar: { left: 'prev today next', center: 'title', right: '' },
          events: events,
          displayEventTime: false,
          dateClick: info => {
            // remove old highlight
            if (lastClickedDayEl) lastClickedDayEl.classList.remove('selected-day');
            // highlight new
            info.dayEl.classList.add('selected-day');
            lastClickedDayEl = info.dayEl;

            showAvailability(info.dateStr, events);
          }
        }
      );
      calendar.render();
    }

    function showAvailability(dateStr, events) {
      const booked = new Set(
        events
          .filter(ev => ev.start.startsWith(dateStr))
          .map(ev => ev.extendedProps.vehicle)
      );
      const available = Object.keys(vehicleColors)
        .filter(v => !booked.has(v));

      let html = `<h3>Available Vehicles for This Day: ${dateStr}</h3>`;
      if (available.length === 0) {
        html += `<p><em>No vehicles available.</em></p>`;
      } else {
        available.forEach(v => {
          html += `
            <div class="available-box" style="background:${vehicleColors[v]}">
              <strong>${v}</strong>
            </div>`;
        });
      }
      document.getElementById("dateInfo").innerHTML = html;
    }

    // logout / auth
    document.getElementById("logout-btn")
      .addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = 'index.html';
      renderLegend();
      renderBottomGasCards();
      allBookings = await fetchAllBookings();
      renderCalendar(allBookings);
    });
  </script>
</body>
</html>
