<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fleet Availability Calendar</title>

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #5cbde5;
      min-height: 100vh;
    }
    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    #container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.25rem 2rem;
      box-sizing: border-box;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }
    #legend {
      width: 260px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }
    .legend-color {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex: 0 0 22px;
    }
    #rightPanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #topPanel {
      display: flex;
      gap: 20px;
    }
    #calendar {
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);

      /* new: limit height and scroll */
      max-height: 75vh;
      overflow-y: auto;
    }
    #bottomGasCards {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.08);
    }
    #bottomGasCards h3 {
      margin: 0 0 12px;
    }
    #gasCardList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .gas-card-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f7f8fa;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }
    .gas-card-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex: 0 0 16px;
    }
    #dateInfo {
      flex: 1;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.08);

      /* new: limit height and scroll */
      max-height: 75vh;
      overflow-y: auto;
    }
    .availability-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }
    .availability-controls label {
      display: grid;
      gap: 5px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }
    .availability-controls input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
    }
    .availability-hint {
      margin: 0 0 14px;
      color: #64748b;
      font-size: 13px;
    }
    .availability-result {
      padding: 11px;
      border: 1px solid #e2e8f0;
      border-left: 6px solid var(--vehicle-accent, #64748b);
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .availability-result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .availability-status {
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .availability-status.available {
      background: #dcfce7;
      color: #166534;
    }
    .availability-status.unavailable {
      background: #fee2e2;
      color: #991b1b;
    }
    .availability-status.maintenance {
      background: #fef3c7;
      color: #92400e;
    }
    .booking-periods {
      margin: 7px 0 0;
      color: #475569;
      font-size: 13px;
      line-height: 1.45;
    }
    .availability-error {
      color: #b91c1c;
      font-weight: 700;
    }
    .manual-access-btn {
      margin-top: 0.75rem;
      border: 0;
      border-radius: 7px;
      padding: 0.7rem 1rem;
      background: #17365d;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    /* hide events */
    .fc .fc-daygrid-event-harness,
    .fc .fc-daygrid-event {
      display: none !important;
    }
    /* only the event container scrolls */
    .fc .fc-daygrid-day-events {
      max-height: 100px;
      overflow-y: auto;
    }
    /* highlight selected day cell */
    .fc .fc-daygrid-day.selected-day {
      background-color: rgba(255, 235, 59, 0.3);
    }
    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }
      body.live-feather-background .feather-canvas {
        display: block;
      }
    }
  </style>
</head>
<body>
  <canvas id="feather-canvas" class="feather-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="header-left">
      <div class="header-logo-box">
        <img src="YFNED_fleet_logo_navy.svg" alt="YFNED Fleet logo" />
      </div>
      <div class="header-title">YFNED Availability Calendar</div>
    </div>
    <div class="header-nav">
      <button class="header-btn" onclick="location.href='fleetmaster.html'">Fleetmaster View</button>
      <button class="header-btn" onclick="location.href='mastercalendar.html'">Master Calendar</button>
      <button class="header-btn active" aria-current="page" onclick="location.href='availability.html'">Availability Calendar</button>
      <button class="header-btn" onclick="location.href='masterbooking.html'">Master Booking</button>
      <button class="header-btn" onclick="location.href='records.html'">Records</button>
      <button id="logout-btn" class="header-btn">Logout</button>
    </div>
  </header>


  <div id="container">
    <div id="legend"></div>
    <div id="rightPanel">
      <div id="topPanel">
        <div id="calendar"></div>
        <div id="dateInfo">
          <h3 id="availability-date-heading">Choose a date</h3>
          <div class="availability-controls">
            <label>
              Start time
              <input id="availability-start" type="time" value="08:30" />
            </label>
            <label>
              End time
              <input id="availability-end" type="time" value="16:30" />
            </label>
          </div>
          <p class="availability-hint">Times are evaluated in Yukon time. Change either time to recalculate.</p>
          <div id="availabilityResults" aria-live="polite">Click a date to view availability.</div>
        </div>
      </div>
      <div id="bottomGasCards">
        <h3>Vehicle Gas Cards</h3>
        <div id="gasCardList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="livefeathers.js"></script>
  <script type="module">
    import { auth, db } from './firebase.js';
    import {
      VEHICLE_COLORS as vehicleColors,
      VEHICLE_GAS_CARD_COLORS as vehicleGasCardColors,
      getCanonicalVehicleName,
      getVehicleExportLabel
    } from './fleet-data.js';
    import { ref, get } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
    import { onAuthStateChanged, signOut }
                                        from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    window.initLiveFeatherBackground();

    let allBookings = [];
    let vehicleStatuses = {};
    let lastClickedDayEl = null;
    let selectedDateStr = '';
    const availabilityStartInput = document.getElementById('availability-start');
    const availabilityEndInput = document.getElementById('availability-end');
    const availabilityHeading = document.getElementById('availability-date-heading');
    const availabilityResults = document.getElementById('availabilityResults');

    function renderLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      for (const [veh, color] of Object.entries(vehicleColors)) {
        const div = document.createElement("div");
        div.className = "legend-item";
        const swatch = document.createElement('div');
        swatch.className = 'legend-color';
        swatch.style.backgroundColor = color;
        const label = document.createElement('span');
        label.textContent = getVehicleExportLabel(veh);
        div.append(swatch, label);
        legend.appendChild(div);
      }
    }

    function renderBottomGasCards() {
      const gasCardList = document.getElementById("gasCardList");
      gasCardList.innerHTML = "";

      for (const [vehicle, color] of Object.entries(vehicleGasCardColors)) {
        const row = document.createElement("div");
        row.className = "gas-card-item";
        const swatch = document.createElement('div');
        swatch.className = 'gas-card-color';
        swatch.style.backgroundColor = color;
        const label = document.createElement('span');
        label.textContent = vehicle;
        row.append(swatch, label);
        gasCardList.appendChild(row);
      }
    }

    async function fetchAllBookings() {
      const snap = await get(ref(db, 'bookings'));
      if (!snap.exists()) return [];
      const events = [];
      snap.forEach(vehicleSnap => {
        const name = getCanonicalVehicleName(vehicleSnap.key);
        vehicleSnap.forEach(bSnap => {
          const b = bSnap.val();
          events.push({
            start: b.startTimeISO,
            end:   b.endTimeISO,
            extendedProps: { vehicle: name, userName: b.userName || '' }
          });
        });
      });
      return events;
    }
    async function fetchVehicleStatuses() {
      const snap = await get(ref(db, 'vehicles'));
      if (!snap.exists()) return {};
      const statuses = {};
      snap.forEach(vehicleSnap => {
        const name = getCanonicalVehicleName(vehicleSnap.key);
        statuses[name] = {
          ...(statuses[name] || {}),
          ...(vehicleSnap.val() || {}),
          databaseVehicleName: vehicleSnap.key
        };
      });
      return statuses;
    }

    function renderCalendar(events) {
      const calendar = new FullCalendar.Calendar(
        document.getElementById("calendar"),
        {
          initialView: 'dayGridMonth',
          headerToolbar: { left: 'prev today next', center: 'title', right: '' },
          events: events,
          displayEventTime: false,
          dateClick: info => {
            if (lastClickedDayEl) lastClickedDayEl.classList.remove('selected-day');
            info.dayEl.classList.add('selected-day');
            lastClickedDayEl = info.dayEl;
            selectedDateStr = info.dateStr;
            const selectedDate = new Date(`${info.dateStr}T12:00:00-07:00`);
            availabilityHeading.textContent = selectedDate.toLocaleDateString('en-CA', {
              timeZone: 'America/Whitehorse',
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            });
            showAvailability(info.dateStr, events);
          }
        }
      );
      calendar.render();
    }

    function formatYukonTime(value) {
      return new Date(value).toLocaleTimeString('en-CA', {
        timeZone: 'America/Whitehorse',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function showAvailability(dateStr, events) {
      const startTime = availabilityStartInput.value;
      const endTime = availabilityEndInput.value;
      availabilityResults.replaceChildren();

      if (!dateStr || !startTime || !endTime) {
        availabilityResults.textContent = 'Choose a date, start time, and end time.';
        return;
      }

      const requestedStart = new Date(`${dateStr}T${startTime}:00-07:00`).getTime();
      const requestedEnd = new Date(`${dateStr}T${endTime}:00-07:00`).getTime();
      if (requestedEnd <= requestedStart) {
        const error = document.createElement('p');
        error.className = 'availability-error';
        error.textContent = 'End time must be later than start time.';
        availabilityResults.appendChild(error);
        return;
      }

      const dayStart = new Date(`${dateStr}T00:00:00-07:00`).getTime();
      const dayEnd = dayStart + 24 * 60 * 60 * 1000;

      Object.entries(vehicleColors).forEach(([vehicle, color]) => {
        const status = vehicleStatuses[vehicle] || {};
        const dayBookings = events
          .filter(event => event.extendedProps.vehicle === vehicle)
          .map(event => ({
            start: new Date(event.start).getTime(),
            end: new Date(event.end).getTime()
          }))
          .filter(booking =>
            Number.isFinite(booking.start)
            && Number.isFinite(booking.end)
            && booking.start < dayEnd
            && booking.end > dayStart
          )
          .sort((a, b) => a.start - b.start);

        const hasConflict = dayBookings.some(booking =>
          requestedStart < booking.end && requestedEnd > booking.start
        );
        const inMaintenance = status.maintenanceStatus === 'outForMaintenance';
        const todayParts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/Whitehorse',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date()).map(part => [part.type, part.value]));
        const todayInYukon = `${todayParts.year}-${todayParts.month}-${todayParts.day}`;
        const operationallyInUse = dateStr === todayInYukon
          && requestedEnd > Date.now()
          && (status.keyStatus === 'withStaff' || status.status === 'signedOut');
        const state = inMaintenance
          ? 'maintenance'
          : operationallyInUse || hasConflict
            ? 'unavailable'
            : 'available';
        const stateLabel = inMaintenance
          ? 'In maintenance'
          : operationallyInUse
            ? 'Currently in use'
            : hasConflict
            ? 'Unavailable'
            : 'Available';

        const card = document.createElement('article');
        card.className = 'availability-result';
        card.style.setProperty('--vehicle-accent', color);

        const header = document.createElement('div');
        header.className = 'availability-result-header';
        const name = document.createElement('strong');
        name.textContent = getVehicleExportLabel(vehicle);
        const badge = document.createElement('span');
        badge.className = `availability-status ${state}`;
        badge.textContent = stateLabel;
        header.append(name, badge);
        card.appendChild(header);

        const details = document.createElement('p');
        details.className = 'booking-periods';
        if (inMaintenance) {
          const reason = status.maintenanceDetails?.reason;
          details.textContent = reason ? `Maintenance: ${reason}` : 'Vehicle is currently out for maintenance.';
        } else if (operationallyInUse) {
          details.textContent = status.keyHeldBy
            ? `Key assigned to ${status.keyHeldBy}.`
            : 'The vehicle is currently signed out.';
        } else if (dayBookings.length) {
          details.textContent = 'Booked: ' + dayBookings
            .map(booking => `${formatYukonTime(booking.start)}–${formatYukonTime(booking.end)}`)
            .join(', ');
        } else {
          details.textContent = 'No bookings on this date.';
        }
        card.appendChild(details);

        const now = Date.now();
        const canUseManualWalkUp = state === 'available'
          && dateStr === todayInYukon
          && requestedStart <= now
          && requestedEnd > now;
        if (canUseManualWalkUp) {
          const manualAccess = document.createElement('button');
          manualAccess.type = 'button';
          manualAccess.className = 'manual-access-btn';
          manualAccess.textContent = 'Manual Pickup (Front Desk)';
          manualAccess.addEventListener('click', () => {
            if (!confirm('Are you at the front desk and receiving this vehicle key?')) return;
            const databaseVehicleName = status.databaseVehicleName || vehicle;
            window.location.href = `keyhand.html?vehicle=${encodeURIComponent(databaseVehicleName)}`;
          });
          card.appendChild(manualAccess);
        }
        availabilityResults.appendChild(card);
      });
    }

    availabilityStartInput.addEventListener('change', () => {
      if (selectedDateStr) showAvailability(selectedDateStr, allBookings);
    });
    availabilityEndInput.addEventListener('change', () => {
      if (selectedDateStr) showAvailability(selectedDateStr, allBookings);
    });

    // logout / auth
    document.getElementById("logout-btn")
      .addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = 'index.html';
      renderLegend();
      renderBottomGasCards();
      [allBookings, vehicleStatuses] = await Promise.all([
        fetchAllBookings(),
        fetchVehicleStatuses()
      ]);
      renderCalendar(allBookings);
    });
  </script>
</body>
</html>
