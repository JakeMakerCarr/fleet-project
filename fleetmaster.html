<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fleetmaster Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #1f8fca;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      table-layout: fixed;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }

    th:nth-child(1), td:nth-child(1) {
      width: 15%;
    }

    th:nth-child(2), td:nth-child(2),
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6) {
      width: 10.5%;
    }

    th:nth-child(3), td:nth-child(3) {
      width: 16%;
      word-break: break-word;
    }

    th:nth-child(7), td:nth-child(7) {
      width: 18%;
    }

    .toggle-btn {
      width: 124px;
      min-height: 46px;
      padding: 0.5rem 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }

    .atFrontDesk { background-color: #e7bbd2; color: black; }
    .withStaff   { background-color: #e0e257; color: black; }
    .signedOut   { background-color: #5cbde5; color: black; }
    .available   { background-color: #2ecc71; color: black; }
    .alarm       { background-color: #d4282f; color: white; }
    .alarm-row   { background-color: #ffdddd !important; }
    .maintenance-report-row td {
      background-color: #1a487e;
      color: white;
    }

    .note-input {
      width: 100%;
      min-height: 3.25rem;
      resize: vertical;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font: inherit;
      box-sizing: border-box;
    }

    .save-status {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 0.35rem;
      display: inline-block;
    }

    .fleet-alert-widget {
      position: relative;
      flex: 0 0 auto;
    }

    .fleet-alert-toggle {
      min-width: 76px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #475569;
    }

    .fleet-alert-widget.has-unread .fleet-alert-toggle {
      background: #d4282f;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .fleet-alert-icon {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .fleet-alert-widget.has-unread .fleet-alert-icon {
      animation: fleet-alert-flash 0.85s steps(2, start) infinite;
    }

    .fleet-alert-count {
      min-width: 22px;
      min-height: 22px;
      padding: 2px 6px;
      border-radius: 999px;
      box-sizing: border-box;
      background: white;
      color: #b91c1c;
      font-size: 0.8rem;
      font-weight: 900;
    }

    .fleet-alert-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(390px, calc(100vw - 2rem));
      max-height: 70vh;
      overflow: auto;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      color: #111827;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.3);
      z-index: 30;
    }

    .fleet-alert-panel[hidden],
    .fleet-alert-widget[hidden] {
      display: none;
    }

    .fleet-alert-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .fleet-alert-panel-header strong {
      font-size: 1rem;
    }

    .fleet-alert-mark-all {
      border: none;
      background: transparent;
      color: #176f9e;
      cursor: pointer;
      font-weight: 700;
    }

    .fleet-alert-list {
      display: grid;
      gap: 8px;
    }

    .fleet-alert-item {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 10px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fff7f7;
      color: #111827;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .fleet-alert-item:hover {
      background: #fee2e2;
    }

    .fleet-alert-item-title {
      font-weight: 800;
    }

    .fleet-alert-item-meta,
    .fleet-alert-item-summary,
    .fleet-alert-empty {
      color: #475569;
      font-size: 0.82rem;
    }

    .fleet-alert-item-summary {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fleet-alert-empty {
      padding: 12px 4px;
      text-align: center;
      font-weight: 700;
    }

    @keyframes fleet-alert-flash {
      50% {
        opacity: 0.25;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fleet-alert-widget.has-unread .fleet-alert-icon {
        animation: none;
      }
    }

    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }

      body.live-feather-background .feather-canvas {
        display: block;
      }
    }

    @media (max-width: 900px) {
      .fleet-alert-panel {
        right: auto;
        left: 0;
      }
    }
  </style>
</head>
<body>
  <canvas id="feather-canvas" class="feather-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="header-left">
      <div class="header-logo-box">
        <img src="YFNED_fleet_logo_navy.svg" alt="YFNED Fleet logo" />
      </div>
      <div class="header-title">YFNED Fleetmaster Controls</div>
    </div>
    <div id="fleet-alert-widget" class="fleet-alert-widget" hidden>
      <button
        id="fleet-alert-toggle"
        class="header-btn fleet-alert-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="fleet-alert-panel"
        aria-label="Maintenance alerts"
      >
        <span class="fleet-alert-icon" aria-hidden="true">!!!</span>
        <span id="fleet-alert-count" class="fleet-alert-count" aria-live="polite">0</span>
      </button>
      <section id="fleet-alert-panel" class="fleet-alert-panel" aria-label="Unread maintenance alerts" hidden>
        <div class="fleet-alert-panel-header">
          <strong>New fleet reports</strong>
          <button id="fleet-alert-mark-all" class="fleet-alert-mark-all" type="button">Mark all read</button>
        </div>
        <div id="fleet-alert-list" class="fleet-alert-list"></div>
      </section>
    </div>
    <div class="header-nav">
      <button class="header-btn active" aria-current="page" onclick="location.href='fleetmaster.html'">Fleetmaster View</button>
      <button class="header-btn" onclick="location.href='mastercalendar.html'">Master Calendar</button>
      <button class="header-btn" onclick="location.href='availability.html'">Availability Calendar</button>
      <button class="header-btn" onclick="location.href='masterbooking.html'">Master Booking</button>
      <button class="header-btn" onclick="location.href='records.html'">Records</button>
      <button id="logout-btn" class="header-btn">Logout</button>
    </div>
  </header>

  <div class="container">
    <h2>Vehicle Key Handoff Status</h2>
    <table id="vehicle-table">
      <thead>
        <tr>
          <th>Vehicle Name</th>
          <th>Key Status</th>
          <th>Key Held By</th>
          <th>Vehicle Status</th>
          <th>Alarm</th>
          <th>Demo Trigger</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="livefeathers.js"></script>
  <script type="module">
    import { auth, db } from './firebase.js';
    import { WORKFLOW_STAGE } from './fleet-workflow.js';
    import {
      getCanonicalVehicleName,
      getVehicleExportLabel as getDisplayName
    } from './fleet-data.js';
    import {
      FLEET_ALERT_TYPE,
      getFleetAlertDestination,
      isFleetAlertRecipient
    } from './fleet-alerts.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { ref, onValue, update, push, set } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

    const logoutBtn = document.getElementById('logout-btn');
    const tableBody = document.querySelector('#vehicle-table tbody');
    const fleetAlertWidget = document.getElementById('fleet-alert-widget');
    const fleetAlertToggle = document.getElementById('fleet-alert-toggle');
    const fleetAlertCount = document.getElementById('fleet-alert-count');
    const fleetAlertPanel = document.getElementById('fleet-alert-panel');
    const fleetAlertList = document.getElementById('fleet-alert-list');
    const fleetAlertMarkAll = document.getElementById('fleet-alert-mark-all');
    let currentAlertUser = null;
    let fleetAlerts = {};
    let fleetAlertReads = {};
    let fleetAlertUnsubscribes = [];

    logoutBtn.addEventListener('click', () => signOut(auth));
    window.initLiveFeatherBackground();

    function getRelatedVehicleNames(name, vehicles) {
      const canonicalName = getCanonicalVehicleName(name);
      const relatedNames = new Set([name, canonicalName]);

      Object.keys(vehicles || {}).forEach(vehicleName => {
        if (getCanonicalVehicleName(vehicleName) === canonicalName) {
          relatedNames.add(vehicleName);
        }
      });

      return Array.from(relatedNames).filter(vehicleName => vehicles?.[vehicleName]);
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }

    async function logVehicleAction(vehicleName, action, details = {}) {
      const entryRef = push(ref(db, `vehicleLogs/${vehicleName}`));
      await set(entryRef, {
        userEmail: auth.currentUser?.email || null,
        action,
        timestamp: Date.now(),
        ...details
      });
    }

    function getUnreadFleetAlerts() {
      return Object.entries(fleetAlerts || {})
        .map(([id, alert]) => ({ id, ...alert }))
        .filter(alert =>
          !fleetAlertReads?.[alert.id] &&
          [FLEET_ALERT_TYPE.CHECKLIST, FLEET_ALERT_TYPE.MAINTENANCE].includes(alert.type) &&
          alert.vehicle &&
          alert.logId
        )
        .sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
    }

    function formatAlertTime(timestamp) {
      const date = new Date(Number(timestamp));
      if (Number.isNaN(date.getTime())) return 'Time unavailable';
      return date.toLocaleString('en-CA', {
        timeZone: 'America/Whitehorse',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    async function openFleetAlert(alert) {
      if (!currentAlertUser) return;
      try {
        await set(ref(db, `fleetAlertReads/${currentAlertUser.uid}/${alert.id}`), Date.now());
      } catch (error) {
        console.error('Could not mark fleet alert as read:', error);
      }
      window.location.href = getFleetAlertDestination(alert);
    }

    function renderFleetAlerts() {
      const unreadAlerts = getUnreadFleetAlerts();
      const unreadCount = unreadAlerts.length;
      fleetAlertCount.textContent = String(unreadCount);
      fleetAlertWidget.classList.toggle('has-unread', unreadCount > 0);
      fleetAlertToggle.setAttribute(
        'aria-label',
        unreadCount ? `${unreadCount} unread maintenance alert${unreadCount === 1 ? '' : 's'}` : 'No unread maintenance alerts'
      );
      fleetAlertMarkAll.hidden = unreadCount === 0;
      fleetAlertList.replaceChildren();

      if (!unreadCount) {
        const empty = document.createElement('div');
        empty.className = 'fleet-alert-empty';
        empty.textContent = 'No new checklist or maintenance reports.';
        fleetAlertList.appendChild(empty);
        return;
      }

      unreadAlerts.slice(0, 10).forEach(alert => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'fleet-alert-item';

        const title = document.createElement('span');
        title.className = 'fleet-alert-item-title';
        title.textContent = `${alert.type === FLEET_ALERT_TYPE.CHECKLIST ? 'Checklist issue' : 'Return comment'} — ${getDisplayName(alert.vehicle)}`;

        const meta = document.createElement('span');
        meta.className = 'fleet-alert-item-meta';
        meta.textContent = `${alert.userEmail || 'Unknown user'} • ${formatAlertTime(alert.timestamp)}`;

        const summary = document.createElement('span');
        summary.className = 'fleet-alert-item-summary';
        summary.textContent = alert.summary || 'Open the matching record for details.';

        item.append(title, meta, summary);
        item.addEventListener('click', () => openFleetAlert(alert));
        fleetAlertList.appendChild(item);
      });
    }

    function setupFleetAlerts(user) {
      fleetAlertUnsubscribes.forEach(unsubscribe => unsubscribe());
      fleetAlertUnsubscribes = [];
      currentAlertUser = user;

      if (!isFleetAlertRecipient(user.email)) {
        fleetAlertWidget.hidden = true;
        return;
      }

      fleetAlertWidget.hidden = false;
      fleetAlertUnsubscribes.push(
        onValue(ref(db, 'fleetAlerts'), snapshot => {
          fleetAlerts = snapshot.exists() ? snapshot.val() : {};
          renderFleetAlerts();
        }),
        onValue(ref(db, `fleetAlertReads/${user.uid}`), snapshot => {
          fleetAlertReads = snapshot.exists() ? snapshot.val() : {};
          renderFleetAlerts();
        })
      );
    }

    fleetAlertToggle.addEventListener('click', () => {
      const unreadAlerts = getUnreadFleetAlerts();
      if (unreadAlerts.length === 1) {
        openFleetAlert(unreadAlerts[0]);
        return;
      }
      const shouldOpen = fleetAlertPanel.hidden;
      fleetAlertPanel.hidden = !shouldOpen;
      fleetAlertToggle.setAttribute('aria-expanded', String(shouldOpen));
    });

    fleetAlertMarkAll.addEventListener('click', async () => {
      if (!currentAlertUser) return;
      const updates = Object.fromEntries(
        getUnreadFleetAlerts().map(alert => [alert.id, Date.now()])
      );
      if (!Object.keys(updates).length) return;
      await update(ref(db, `fleetAlertReads/${currentAlertUser.uid}`), updates);
    });

    document.addEventListener('click', event => {
      if (!fleetAlertWidget.contains(event.target)) {
        fleetAlertPanel.hidden = true;
        fleetAlertToggle.setAttribute('aria-expanded', 'false');
      }
    });

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      setupFleetAlerts(user);

      const vehiclesRef = ref(db, 'vehicles');

      onValue(vehiclesRef, snapshot => {
        if (!snapshot.exists()) return;

        tableBody.innerHTML = '';

        const vehicles = snapshot.val();
        const now = Date.now();
        const renderedVehicles = new Set();

        Object.entries(vehicles).forEach(([name, data]) => {
          const canonicalName = getCanonicalVehicleName(name);
          const sourceName = vehicles[canonicalName] ? canonicalName : name;
          const relatedVehicleNames = getRelatedVehicleNames(sourceName, vehicles);
          if (renderedVehicles.has(sourceName)) return;

          const vehicleData = vehicles[sourceName] || data;
          renderedVehicles.add(sourceName);

          const displayName = getDisplayName(sourceName);
          const keyStatus = vehicleData.keyStatus || 'atFrontDesk';
          const keyHeldBy = vehicleData.keyHeldBy || '';
          const vehicleStatus = vehicleData.status || 'available';
          const lastKeyChange = vehicleData.lastKeyChange || 0;
          const alarm = vehicleData.alarm === true;
          const maintenanceAlert = vehicleData.maintenanceAlert === true;
          const alertActive = alarm || maintenanceAlert;

          const elapsed = now - lastKeyChange;
          const overdue =
            elapsed > 3600000 &&
            keyStatus === 'withStaff' &&
            vehicleStatus === 'available' &&
            alarm;

          const row = document.createElement('tr');
          if (overdue) row.classList.add('alarm-row');
          if (maintenanceAlert) row.classList.add('maintenance-report-row');

          const keyBtn = document.createElement('button');
          keyBtn.textContent =
            keyStatus === 'atFrontDesk'
              ? 'At The Front Desk'
              : 'Out With Staff Member';
          keyBtn.className = 'toggle-btn ' + keyStatus;
          keyBtn.onclick = async () => {
            const toStaff = keyStatus === 'atFrontDesk';
            const nextState = {
              keyStatus: toStaff ? 'withStaff' : 'atFrontDesk',
              keyHeldBy: toStaff ? user.email : null,
              lastKeyChange: Date.now(),
              alarm: toStaff,
              workflowStage: toStaff
                ? WORKFLOW_STAGE.KEY_PICKED_UP
                : WORKFLOW_STAGE.KEY_RETURNED
            };
            if (!toStaff) {
              nextState.status = 'available';
              nextState.CurrentlySignedOutBy = null;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterKeyStatusOverride', nextState);
          };

          const vehicleBtn = document.createElement('button');
          vehicleBtn.textContent =
            vehicleStatus === 'available'
              ? 'Available'
              : 'Signed Out by Staff';
          vehicleBtn.className =
            'toggle-btn ' + (vehicleStatus === 'available' ? 'available' : 'signedOut');
          vehicleBtn.onclick = async () => {
            const isOut = vehicleStatus === 'available';
            const nextState = {
              status: isOut ? 'signedOut' : 'available',
              alarm: isOut ? false : alarm,
              workflowStage: isOut
                ? WORKFLOW_STAGE.VEHICLE_SIGNED_OUT
                : WORKFLOW_STAGE.VEHICLE_RETURNED
            };
            if (isOut) {
              nextState.CurrentlySignedOutBy = keyHeldBy || user.email;
            } else {
              nextState.CurrentlySignedOutBy = null;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterVehicleStatusOverride', nextState);
          };

          const alarmBtn = document.createElement('button');
          alarmBtn.textContent = alertActive ? 'Disable Alarm' : 'Enable Alarm';
          alarmBtn.className = 'toggle-btn alarm';
          alarmBtn.onclick = async () => {
            const nextAlarm = !alertActive;
            const updates = { alarm: nextAlarm };
            if (!nextAlarm) {
              updates.maintenanceAlert = false;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), updates)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterAlarmOverride', updates);
          };

          const triggerBtn = document.createElement('button');
          triggerBtn.textContent = '🔔 Trigger';
          triggerBtn.className = 'toggle-btn alarm';
          triggerBtn.onclick = async () => {
            const oneHourAgo = Date.now() - 3600001;
            const nextState = {
              alarm: true,
              lastKeyChange: oneHourAgo,
              keyStatus: 'withStaff',
              status: 'available',
              keyHeldBy: user.email,
              CurrentlySignedOutBy: null,
              workflowStage: WORKFLOW_STAGE.KEY_PICKED_UP
            };
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterDemoTrigger', nextState);
          };

          const createCell = (content) => {
            const td = document.createElement('td');
            if (content instanceof HTMLElement) {
              td.appendChild(content);
            } else {
              td.textContent = content;
            }
            return td;
          };

          row.appendChild(createCell(overdue ? `🚨 ${displayName}` : displayName));
          row.appendChild(createCell(keyBtn));
          row.appendChild(createCell(keyHeldBy));
          row.appendChild(createCell(vehicleBtn));
          row.appendChild(createCell(alarmBtn));
          row.appendChild(createCell(triggerBtn));

          const note = vehicleData.note || '';
          const noteBox = document.createElement('div');

          const noteEl = document.createElement('textarea');
          noteEl.className = 'note-input';
          noteEl.placeholder = 'Paste text here to leave a live note...';
          noteEl.value = note;
          noteEl.maxLength = 500;

          const statusEl = document.createElement('span');
          statusEl.className = 'save-status';
          statusEl.textContent = '';

          const doSave = async (val) => {
            try {
              statusEl.textContent = 'Saving...';
              const noteUpdates = {
                note: val,
                noteEditedBy: auth.currentUser?.email || null,
                noteEditedAt: Date.now()
              };
              await Promise.all(
                relatedVehicleNames.map(vehicleName =>
                  update(ref(db, 'vehicles/' + vehicleName), noteUpdates)
                )
              );
              await logVehicleAction(sourceName, 'fleetmasterNoteEdited', {
                note: val,
                noteEditedBy: auth.currentUser?.email || null
              });
              statusEl.textContent = 'Saved';
              setTimeout(() => {
                if (statusEl.textContent === 'Saved') {
                  statusEl.textContent = '';
                }
              }, 1200);
            } catch (e) {
              console.error('Note save failed', e);
              statusEl.textContent = 'Save failed - retrying...';
            }
          };

          const debouncedSave = debounce(doSave, 600);

          noteEl.addEventListener('input', () => {
            statusEl.textContent = 'Saving...';
            debouncedSave(noteEl.value);
          });

          noteEl.addEventListener('blur', () => doSave(noteEl.value));

          noteBox.appendChild(noteEl);
          noteBox.appendChild(statusEl);
          row.appendChild(createCell(noteBox));

          tableBody.appendChild(row);
        });
      });
    });

  </script>

</body>
</html>
