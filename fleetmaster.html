<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fleetmaster Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #1f8fca;
      background-image: url('skybackgroundmidnightfeather.png');
      background-repeat: repeat;
      background-size: 400px;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      table-layout: fixed;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }

    th:nth-child(1), td:nth-child(1) {
      width: 15%;
    }

    th:nth-child(2), td:nth-child(2),
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6) {
      width: 10.5%;
    }

    th:nth-child(3), td:nth-child(3) {
      width: 16%;
      word-break: break-word;
    }

    th:nth-child(7), td:nth-child(7) {
      width: 18%;
    }

    .toggle-btn {
      width: 124px;
      min-height: 46px;
      padding: 0.5rem 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }

    .atFrontDesk { background-color: #e7bbd2; color: black; }
    .withStaff   { background-color: #e0e257; color: black; }
    .signedOut   { background-color: #5cbde5; color: black; }
    .available   { background-color: #2ecc71; color: black; }
    .alarm       { background-color: #d4282f; color: white; }
    .alarm-row   { background-color: #ffdddd !important; }
    .maintenance-report-row td {
      background-color: #1a487e;
      color: white;
    }

    .note-input {
      width: 100%;
      min-height: 3.25rem;
      resize: vertical;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font: inherit;
      box-sizing: border-box;
    }

    .save-status {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 0.35rem;
      display: inline-block;
    }

    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }

      body.live-feather-background .feather-canvas {
        display: block;
      }
    }
  </style>
</head>
<body>
  <canvas id="feather-canvas" class="feather-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="header-left">
      <div class="header-logo-box">
        <img src="YFNED_fleet_logo_navy.svg" alt="YFNED Fleet logo" />
      </div>
      <div class="header-title">YFNED Fleetmaster Controls</div>
    </div>
    <div class="header-nav">
      <button class="header-btn active" aria-current="page" onclick="location.href='fleetmaster.html'">Fleetmaster View</button>
      <button class="header-btn" onclick="location.href='mastercalendar.html'">Master Calendar</button>
      <button class="header-btn" onclick="location.href='availability.html'">Availability Calendar</button>
      <button class="header-btn" onclick="location.href='masterbooking.html'">Master Booking</button>
      <button class="header-btn" onclick="location.href='records.html'">Records</button>
      <button id="logout-btn" class="header-btn">Logout</button>
    </div>
  </header>

  <div class="container">
    <h2>Vehicle Key Handoff Status</h2>
    <table id="vehicle-table">
      <thead>
        <tr>
          <th>Vehicle Name</th>
          <th>Key Status</th>
          <th>Key Held By</th>
          <th>Vehicle Status</th>
          <th>Alarm</th>
          <th>Demo Trigger</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { getDatabase, ref, onValue, update, push, set } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

    const app = initializeApp({
      apiKey: "AIzaSyAjnCWLnUf8msIUjL0TBdZ1eCAiXMLOwvU",
      authDomain: "yfned-fleet-nfc.firebaseapp.com",
      databaseURL: "https://yfned-fleet-nfc-default-rtdb.firebaseio.com",
      projectId: "yfned-fleet-nfc",
      storageBucket: "yfned-fleet-nfc.appspot.com",
      messagingSenderId: "482363667898",
      appId: "1:482363667898:web:4b0364e891a221e9631983"
    });

    const auth = getAuth(app);
    const db = getDatabase(app);

    const logoutBtn = document.getElementById('logout-btn');
    const tableBody = document.querySelector('#vehicle-table tbody');
    const featherCanvas = document.getElementById('feather-canvas');

    logoutBtn.addEventListener('click', () => signOut(auth));
    setupLiveFeatherBackground();

    // Visual labels only - database keys remain unchanged
    const DISPLAY_NAME_MAP = {
      '01-20 2021 Red Traverse CM335': 'Red Traverse CM335',
      '02-20 2021 Black Traverse CM366': 'Black Traverse CM366',
      '03-21 2021 Grey Traverse CN360': 'Grey Traverse CN360',
      '03-21 2021 Grey Traverse CN360 Nutrition Team Only': 'Grey Traverse CN360',
      '04-21 2021 Shadow Silverado 1500 CM695': 'Shadow Silverado CM695',
      '06-21 2020 Grey Grand Caravan CN468': 'Grey Grand Caravan CN468',
      '06-21 2020 Grey Grand Caravan CN468 Early Years Only': 'Grey Grand Caravan CN468',
      '07-21 2021 White Terrain CN466': 'White Terrain CN466',
      '07-21 2021 White Terrain CN466 Early Years Only': 'White Terrain CN466',
      '08-21 2021 Black Terrain CN467': 'Black Terrain CN467',
      '08-21 2021 Black Terrain CN467 Early Years Only': 'Black Terrain CN467',
      '10-24 2025 Green Trailblazer C838B': 'Green Trailblazer C838B',
      '10-24 2025 Green MTU Trailblazer C838B': 'Green Trailblazer C838B',
      '11-24 2024 Grey Traverse CS266': 'Grey Traverse CS266',
      '13-24 2024 Grey Traverse CT008': 'Grey Traverse CT008',
      '14-24 2024 Grey Traverse C443C': 'Grey Traverse C443C',
      '15-24 2024 Grey Traverse C444C': 'Grey Traverse C444C',
      '16-24 2024 Blue Traverse CT073': 'Blue Traverse CT073',
      '17-25 2025 Black Buick Envision CV294': 'Black Buick Envision CV294',
      '18-25 2025 Ford Transit Van C115C': 'Ford Transit Van C115C',
      '18-25 2025 Ford Transit Van - C115C': 'Ford Transit Van C115C',
      'Test NFC Card': 'Test NFC Card'
    };

    const VEHICLE_ALIASES = {
      '03-21 2021 Grey Traverse CN360': '03-21 2021 Grey Traverse CN360 Nutrition Team Only',
      '06-21 2020 Grey Grand Caravan CN468': '06-21 2020 Grey Grand Caravan CN468 Early Years Only',
      '07-21 2021 White Terrain CN466': '07-21 2021 White Terrain CN466 Early Years Only',
      '08-21 2021 Black Terrain CN467': '08-21 2021 Black Terrain CN467 Early Years Only',
      '10-24 2025 Green Trailblazer C838B': '10-24 2025 Green MTU Trailblazer C838B',
      '18-25 2025 Ford Transit Van C115C': '18-25 2025 Ford Transit Van - C115C'
    };

    function getCanonicalVehicleName(name) {
      return VEHICLE_ALIASES[name] || name;
    }

    function getRelatedVehicleNames(name, vehicles) {
      const canonicalName = getCanonicalVehicleName(name);
      const relatedNames = new Set([name, canonicalName]);

      Object.keys(vehicles || {}).forEach(vehicleName => {
        if (getCanonicalVehicleName(vehicleName) === canonicalName) {
          relatedNames.add(vehicleName);
        }
      });

      return Array.from(relatedNames).filter(vehicleName => vehicles?.[vehicleName]);
    }

    function getDisplayName(name) {
      return DISPLAY_NAME_MAP[name] || name;
    }

    function setupLiveFeatherBackground() {
      const ctx = featherCanvas?.getContext('2d');
      if (!ctx || !featherCanvas) return;

      const desktopQuery = window.matchMedia('(min-width: 900px)');
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const featherSources = [
        'assets/blackfeather.png'
      ];
      const featherImages = featherSources.map(src => {
        const image = new Image();
        image.src = src;
        return image;
      });

      const feathers = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let animationFrameId = null;
      let spawnTimerId = null;

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function resizeCanvas() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        featherCanvas.width = Math.round(width * dpr);
        featherCanvas.height = Math.round(height * dpr);
        featherCanvas.style.width = `${width}px`;
        featherCanvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createFeather(initial = false) {
        const image = featherImages[Math.floor(Math.random() * featherImages.length)];
        return {
          image,
          x: randomBetween(-80, width + 80),
          y: initial ? randomBetween(-height, height) : randomBetween(-180, -30),
          scale: 1,
          speedY: randomBetween(0.45, 1.2),
          driftBase: randomBetween(-0.18, 0.18),
          driftAmplitude: randomBetween(0.3, 1.1),
          driftFrequency: randomBetween(0.008, 0.022),
          phase: randomBetween(0, Math.PI * 2),
          rotation: randomBetween(0, Math.PI * 2),
          rotationSpeed: randomBetween(-0.007, 0.007),
          opacity: randomBetween(0.68, 0.95)
        };
      }

      function drawFeather(feather) {
        const image = feather.image;
        if (!image.complete || !image.naturalWidth) return;
        const drawWidth = image.naturalWidth * feather.scale;
        const drawHeight = image.naturalHeight * feather.scale;

        ctx.save();
        ctx.globalAlpha = feather.opacity;
        ctx.translate(feather.x, feather.y);
        ctx.rotate(feather.rotation);
        ctx.drawImage(image, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();
      }

      function tick() {
        ctx.clearRect(0, 0, width, height);

        for (let i = feathers.length - 1; i >= 0; i -= 1) {
          const feather = feathers[i];
          feather.phase += feather.driftFrequency;
          feather.y += feather.speedY;
          feather.x += feather.driftBase + Math.sin(feather.phase) * feather.driftAmplitude;
          feather.rotation += feather.rotationSpeed + Math.sin(feather.phase * 0.8) * 0.002;

          const maxDimension = Math.max(
            (feather.image?.naturalWidth || 44) * feather.scale,
            (feather.image?.naturalHeight || 44) * feather.scale
          );
          if (feather.y - maxDimension > height + 48 || feather.x < -140 || feather.x > width + 140) {
            feathers.splice(i, 1);
            continue;
          }

          drawFeather(feather);
        }

        animationFrameId = window.requestAnimationFrame(tick);
      }

      function startAnimation() {
        if (animationFrameId || spawnTimerId || !desktopQuery.matches || reducedMotionQuery.matches) return;

        document.body.classList.add('live-feather-background');
        resizeCanvas();
        feathers.length = 0;

        for (let i = 0; i < 110; i += 1) {
          feathers.push(createFeather(true));
        }

        spawnTimerId = window.setInterval(() => {
          if (feathers.length < 200) {
            feathers.push(createFeather(false));
          }
        }, 900);

        tick();
      }

      function stopAnimation() {
        document.body.classList.remove('live-feather-background');
        if (animationFrameId) {
          window.cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        if (spawnTimerId) {
          window.clearInterval(spawnTimerId);
          spawnTimerId = null;
        }
        feathers.length = 0;
        ctx.clearRect(0, 0, width, height);
      }

      function syncAnimationMode() {
        if (desktopQuery.matches && !reducedMotionQuery.matches) {
          startAnimation();
        } else {
          stopAnimation();
        }
      }

      window.addEventListener('resize', () => {
        if (desktopQuery.matches && !reducedMotionQuery.matches) {
          resizeCanvas();
        }
      });
      desktopQuery.addEventListener('change', syncAnimationMode);
      reducedMotionQuery.addEventListener('change', syncAnimationMode);
      syncAnimationMode();
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }

    async function logVehicleAction(vehicleName, action, details = {}) {
      const entryRef = push(ref(db, `vehicleLogs/${vehicleName}`));
      await set(entryRef, {
        userEmail: auth.currentUser?.email || null,
        action,
        timestamp: Date.now(),
        ...details
      });
    }

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      const vehiclesRef = ref(db, 'vehicles');

      onValue(vehiclesRef, snapshot => {
        if (!snapshot.exists()) return;

        tableBody.innerHTML = '';

        const vehicles = snapshot.val();
        const now = Date.now();
        const renderedVehicles = new Set();

        Object.entries(vehicles).forEach(([name, data]) => {
          const canonicalName = getCanonicalVehicleName(name);
          const sourceName = vehicles[canonicalName] ? canonicalName : name;
          const relatedVehicleNames = getRelatedVehicleNames(sourceName, vehicles);
          if (renderedVehicles.has(sourceName)) return;

          const vehicleData = vehicles[sourceName] || data;
          renderedVehicles.add(sourceName);

          const displayName = getDisplayName(sourceName);
          const keyStatus = vehicleData.keyStatus || 'atFrontDesk';
          const keyHeldBy = vehicleData.keyHeldBy || '';
          const vehicleStatus = vehicleData.status || 'available';
          const lastKeyChange = vehicleData.lastKeyChange || 0;
          const alarm = vehicleData.alarm === true;
          const maintenanceAlert = vehicleData.maintenanceAlert === true;
          const alertActive = alarm || maintenanceAlert;

          const elapsed = now - lastKeyChange;
          const overdue =
            elapsed > 3600000 &&
            keyStatus === 'withStaff' &&
            vehicleStatus === 'available' &&
            alarm;

          const row = document.createElement('tr');
          if (overdue) row.classList.add('alarm-row');
          if (maintenanceAlert) row.classList.add('maintenance-report-row');

          const keyBtn = document.createElement('button');
          keyBtn.textContent =
            keyStatus === 'atFrontDesk'
              ? 'At The Front Desk'
              : 'Out With Staff Member';
          keyBtn.className = 'toggle-btn ' + keyStatus;
          keyBtn.onclick = async () => {
            const toStaff = keyStatus === 'atFrontDesk';
            const nextState = {
              keyStatus: toStaff ? 'withStaff' : 'atFrontDesk',
              keyHeldBy: toStaff ? user.email : null,
              lastKeyChange: Date.now(),
              alarm: toStaff
            };
            if (!toStaff) {
              nextState.status = 'available';
              nextState.CurrentlySignedOutBy = null;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterKeyStatusOverride', nextState);
          };

          const vehicleBtn = document.createElement('button');
          vehicleBtn.textContent =
            vehicleStatus === 'available'
              ? 'Available'
              : 'Signed Out by Staff';
          vehicleBtn.className =
            'toggle-btn ' + (vehicleStatus === 'available' ? 'available' : 'signedOut');
          vehicleBtn.onclick = async () => {
            const isOut = vehicleStatus === 'available';
            const nextState = {
              status: isOut ? 'signedOut' : 'available',
              alarm: isOut ? false : alarm
            };
            if (!isOut) {
              nextState.CurrentlySignedOutBy = null;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterVehicleStatusOverride', nextState);
          };

          const alarmBtn = document.createElement('button');
          alarmBtn.textContent = alertActive ? 'Disable Alarm' : 'Enable Alarm';
          alarmBtn.className = 'toggle-btn alarm';
          alarmBtn.onclick = async () => {
            const nextAlarm = !alertActive;
            const updates = { alarm: nextAlarm };
            if (!nextAlarm) {
              updates.maintenanceAlert = false;
            }
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), updates)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterAlarmOverride', updates);
          };

          const triggerBtn = document.createElement('button');
          triggerBtn.textContent = '🔔 Trigger';
          triggerBtn.className = 'toggle-btn alarm';
          triggerBtn.onclick = async () => {
            const oneHourAgo = Date.now() - 3600001;
            const nextState = {
              alarm: true,
              lastKeyChange: oneHourAgo,
              keyStatus: 'withStaff',
              status: 'available'
            };
            await Promise.all(
              relatedVehicleNames.map(vehicleName =>
                update(ref(db, 'vehicles/' + vehicleName), nextState)
              )
            );
            await logVehicleAction(sourceName, 'fleetmasterDemoTrigger', nextState);
          };

          const createCell = (content) => {
            const td = document.createElement('td');
            if (content instanceof HTMLElement) {
              td.appendChild(content);
            } else {
              td.textContent = content;
            }
            return td;
          };

          row.appendChild(createCell(overdue ? `🚨 ${displayName}` : displayName));
          row.appendChild(createCell(keyBtn));
          row.appendChild(createCell(keyHeldBy));
          row.appendChild(createCell(vehicleBtn));
          row.appendChild(createCell(alarmBtn));
          row.appendChild(createCell(triggerBtn));

          const note = vehicleData.note || '';
          const noteBox = document.createElement('div');

          const noteEl = document.createElement('textarea');
          noteEl.className = 'note-input';
          noteEl.placeholder = 'Paste text here to leave a live note...';
          noteEl.value = note;
          noteEl.maxLength = 500;

          const statusEl = document.createElement('span');
          statusEl.className = 'save-status';
          statusEl.textContent = '';

          const doSave = async (val) => {
            try {
              statusEl.textContent = 'Saving...';
              const noteUpdates = {
                note: val,
                noteEditedBy: auth.currentUser?.email || null,
                noteEditedAt: Date.now()
              };
              await Promise.all(
                relatedVehicleNames.map(vehicleName =>
                  update(ref(db, 'vehicles/' + vehicleName), noteUpdates)
                )
              );
              await logVehicleAction(sourceName, 'fleetmasterNoteEdited', {
                note: val,
                noteEditedBy: auth.currentUser?.email || null
              });
              statusEl.textContent = 'Saved';
              setTimeout(() => {
                if (statusEl.textContent === 'Saved') {
                  statusEl.textContent = '';
                }
              }, 1200);
            } catch (e) {
              console.error('Note save failed', e);
              statusEl.textContent = 'Save failed - retrying...';
            }
          };

          const debouncedSave = debounce(doSave, 600);

          noteEl.addEventListener('input', () => {
            statusEl.textContent = 'Saving...';
            debouncedSave(noteEl.value);
          });

          noteEl.addEventListener('blur', () => doSave(noteEl.value));

          noteBox.appendChild(noteEl);
          noteBox.appendChild(statusEl);
          row.appendChild(createCell(noteBox));

          tableBody.appendChild(row);
        });
      });
    });

  </script>

</body>
</html>
