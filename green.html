<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YFNED Green NFC Card</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: #86d49c;
      color: #172033;
      font-family: sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 520px);
      padding: 2rem;
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
    }
  </style>
</head>
<body>
  <main>
    <h1>YFNED Vehicle Access</h1>
    <p id="status">Opening the green-card vehicle checklist…</p>
  </main>

  <script type="module">
    import { getVehicleNameFromCode } from './fleet-data.js';

    const code = new URLSearchParams(window.location.search).get('v');
    const vehicle = getVehicleNameFromCode(code);
    const status = document.getElementById('status');

    if (!code) {
      status.textContent = 'This green NFC link is missing its vehicle code.';
    } else if (!vehicle) {
      status.textContent = `Unknown vehicle code: ${code}`;
    } else {
      window.location.replace(`nfc.html?vehicle=${encodeURIComponent(vehicle)}`);
    }
  </script>
</body>
</html>
