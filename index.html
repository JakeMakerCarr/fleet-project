<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fleet Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      background-color: #5cbde5;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      min-height: 100vh;
    }
    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .logo {
      max-width: 200px;
      margin-bottom: 1rem;
    }
    input {
      display: block;
      margin: 0.5rem auto;
      padding: 0.5rem;
      width: 200px;
      font-size: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #forgot-btn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    #message {
      margin-top: 1rem;
      color: red;
    }
    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }
      body.live-feather-background .feather-canvas {
        display: block;
      }
    }
  </style>
</head>
<body>
<canvas id="feather-canvas" class="feather-canvas" aria-hidden="true"></canvas>

<div class="login-container">
  <img src="YFNED_fleet_logo_navy.svg" alt="YFNED Logo" class="logo" />

  <input type="email" id="login-email" placeholder="Email" />
  <input type="password" id="login-password" placeholder="Password" />
  <button id="login-btn">Login</button>
  <button id="forgot-btn">Forgot Password?</button>

  <div id="message"></div>
</div>

<script src="livefeathers.js"></script>
<script type="module">
  import {
    auth,
    authPersistenceReady,
    clearRecentAuthSession,
    db,
    hasRecentAuthSession,
    touchRecentAuthSession
  } from './firebase.js';
  import {
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut,
    sendPasswordResetEmail
  } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
  import {
    ref,
    get,
    set,
    child
  } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
  window.initLiveFeatherBackground();

  const loginBtn = document.getElementById('login-btn');
  const forgotBtn = document.getElementById('forgot-btn');
  const emailInput = document.getElementById('login-email');
  const passInput = document.getElementById('login-password');
  const msgDiv = document.getElementById('message');
  const urlParams = new URLSearchParams(window.location.search);
  const allowedRedirects = new Set(['nfc.html', 'keyhand.html']);
  let loginAttemptInProgress = false;

  function getRedirectDestination() {
    const redirect = urlParams.get('redirect');
    if (!allowedRedirects.has(redirect)) return '';

    const destinationParams = new URLSearchParams();
    const vehicle = urlParams.get('vehicle');
    const source = urlParams.get('source');
    if (vehicle) destinationParams.set('vehicle', vehicle);
    if (source) destinationParams.set('source', source);

    const query = destinationParams.toString();
    return `${redirect}${query ? `?${query}` : ''}`;
  }

  await authPersistenceReady;
  onAuthStateChanged(auth, async (user) => {
    if (!user || loginAttemptInProgress) return;

    if (!hasRecentAuthSession()) {
      clearRecentAuthSession();
      await signOut(auth);
      return;
    }

    const destination = getRedirectDestination();
    if (destination) {
      touchRecentAuthSession();
      window.location.replace(destination);
    }
  });

  loginBtn.addEventListener('click', async () => {
    msgDiv.style.color = 'red';
    msgDiv.textContent = '';
    const email = emailInput.value;
    const pass = passInput.value;

    if (!email || !pass) {
      msgDiv.textContent = 'Please enter email and password.';
      return;
    }

    loginAttemptInProgress = true;
    try {
      await authPersistenceReady;
      const userCredential = await signInWithEmailAndPassword(auth, email, pass);
      const user = userCredential.user;
      touchRecentAuthSession();

      const userRef = ref(db, 'users/' + user.uid);
      const userSnap = await get(userRef);
      if (!userSnap.exists()) {
        await set(userRef, {
          email: user.email,
          role: 'staff'
        });
      }

      // Redirect support for NFC and key handoff pages.
      const destination = getRedirectDestination();
      if (destination) {
        window.location.href = destination;
        return;
      }

      // 🧑‍💼 Role-based fallback
      const roleSnap = await get(child(ref(db), `users/${user.uid}/role`));
      const role = roleSnap.exists() ? roleSnap.val() : 'staff';

      if (role === 'fleetmaster') {
        window.location.href = 'fleetmaster.html';
      } else {
        window.location.href = 'foryou.html';
      }
    } catch (err) {
      loginAttemptInProgress = false;
      msgDiv.textContent = 'Login failed: ' + err.message;
    }
  });

  forgotBtn.addEventListener('click', async () => {
    msgDiv.textContent = '';
    msgDiv.style.color = 'red';
    const email = emailInput.value;

    if (!email) {
      msgDiv.textContent = 'Please enter your email to reset your password.';
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
      msgDiv.style.color = 'green';
      msgDiv.textContent = 'Password reset email sent. Please check your inbox.';
    } catch (error) {
      msgDiv.style.color = 'red';
      msgDiv.textContent = 'Error: ' + error.message;
    }
  });
</script>

</body>
</html>
