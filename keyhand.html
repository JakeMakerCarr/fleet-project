<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Key Handoff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: #5cbde5;
      font-family: sans-serif;
      text-align: center;
      padding: 3rem;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    #status {
      font-size: 1.25rem;
      margin-top: 2rem;
      font-weight: bold;
      color: #333;
    }
    #actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.85rem 1.2rem;
      background: #17365d;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #6b7280; }
  </style>
</head>
<body>
  <h1>YFNED Key Handoff</h1>
  <div id="status">Checking login...</div>
  <div id="actions" hidden>
    <button id="primary-action" type="button"></button>
    <button id="return-unused-key" class="secondary" type="button" hidden>Return Unused Key</button>
  </div>

  <script type="module">
    import {
      auth,
      authPersistenceReady,
      clearRecentAuthSession,
      db,
      hasRecentAuthSession,
      touchRecentAuthSession
    } from './firebase.js';
    import {
      WORKFLOW_STAGE,
      claimKey,
      getVehicleState,
      returnKey
    } from './fleet-workflow.js';
    import { getDatabaseVehicleName } from './fleet-data.js';
    import { ref, push, set } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

    const statusDiv = document.getElementById('status');
    const actions = document.getElementById('actions');
    const primaryAction = document.getElementById('primary-action');
    const returnUnusedKey = document.getElementById('return-unused-key');
    const params = new URLSearchParams(window.location.search);
    const vehicle = getDatabaseVehicleName(decodeURIComponent(params.get('vehicle') || ''));
    let redirectingToLogin = false;

    function redirectToLogin() {
      if (redirectingToLogin) return;
      redirectingToLogin = true;
      const loginParams = new URLSearchParams({
        redirect: 'keyhand.html',
        vehicle
      });
      window.location.replace(`index.html?${loginParams.toString()}`);
    }

    async function logVehicleAction(vehicleName, userEmail, action, details = {}) {
      const logRef = push(ref(db, `vehicleLogs/${vehicleName}`));
      await set(logRef, {
        userEmail,
        action,
        timestamp: Date.now(),
        ...details
      });
    }

    if (!vehicle) {
      statusDiv.textContent = 'Error: No vehicle name in URL.';
      throw new Error('Missing vehicle');
    }

    await authPersistenceReady;
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        redirectToLogin();
        return;
      }

      if (!hasRecentAuthSession()) {
        clearRecentAuthSession();
        await signOut(auth);
        redirectToLogin();
        return;
      }

      touchRecentAuthSession();
      await handleKeyHandoff(user.email);
    });

    function showAction(label, handler) {
      actions.hidden = false;
      primaryAction.hidden = false;
      primaryAction.textContent = label;
      primaryAction.onclick = handler;
    }

    function openVehicleAccess() {
      window.location.href = `nfc.html?vehicle=${encodeURIComponent(vehicle)}&source=manualChecklist`;
    }

    async function returnUnused(userEmail) {
      primaryAction.disabled = true;
      returnUnusedKey.disabled = true;
      try {
        const result = await returnKey(db, vehicle, userEmail, { allowUnused: true });
        await logVehicleAction(vehicle, userEmail, 'keyReturnedUnused', {
          keyStatus: result.state.keyStatus,
          keyHeldBy: result.state.keyHeldBy || null,
          workflowStage: result.state.workflowStage
        });
        statusDiv.textContent = '✅ Key returned to the front desk.';
        actions.hidden = true;
      } catch (error) {
        statusDiv.textContent = '❌ ' + (error.message || error);
        primaryAction.disabled = false;
        returnUnusedKey.disabled = false;
      }
    }

    async function handleKeyHandoff(userEmail) {
      try {
        const data = await getVehicleState(db, vehicle);
        const keyStatus = data.keyStatus || 'atFrontDesk';

        if (keyStatus === 'atFrontDesk') {
          const result = await claimKey(db, vehicle, userEmail, 'pinkNfc');
          if (result.outcome === 'recentlyReturned') {
            statusDiv.textContent = '✅ The key remains recorded at the front desk. The repeated pink-card scan did not check it out again.';
            actions.hidden = true;
            return;
          }
          await logVehicleAction(vehicle, userEmail, 'keyPickedUp', {
            keyStatus: result.state.keyStatus,
            keyHeldBy: result.state.keyHeldBy || null,
            workflowStage: result.state.workflowStage,
            source: 'pinkNfc'
          });
          statusDiv.textContent = `✅ The key for "${vehicle}" is assigned to you. Take the key to the vehicle and scan the green card.`;
          showAction('Open Checklist (Manual Fallback)', openVehicleAccess);
          return;
        }

        if (String(data.keyHeldBy || '').toLowerCase() !== userEmail.toLowerCase()) {
          statusDiv.textContent = data.keyHeldBy
            ? `❌ This key is already assigned to ${data.keyHeldBy}.`
            : '❌ This key is already marked as out with another staff member.';
          return;
        }

        if ((data.status || 'available') === 'signedOut') {
          statusDiv.textContent = 'The vehicle must be returned before the key can be handed back to the front desk.';
          showAction('Open Vehicle Return', openVehicleAccess);
          return;
        }

        if (data.workflowStage === WORKFLOW_STAGE.VEHICLE_RETURNED) {
          const result = await returnKey(db, vehicle, userEmail);
          touchRecentAuthSession();
          await logVehicleAction(vehicle, userEmail, 'keyReturned', {
            keyStatus: result.state.keyStatus,
            keyHeldBy: result.state.keyHeldBy || null,
            workflowStage: result.state.workflowStage,
            source: 'pinkNfc'
          });
          statusDiv.textContent = '✅ Vehicle trip complete. The key is now recorded at the front desk.';
          return;
        }

        if (data.workflowStage === WORKFLOW_STAGE.CHECKLIST_COMPLETED) {
          statusDiv.textContent = 'Checklist completed. Go to the vehicle and tap the green NFC card to sign it out before driving.';
          actions.hidden = true;
          return;
        }

        statusDiv.textContent = data.workflowStage === WORKFLOW_STAGE.KEY_PICKED_UP
          ? 'The key is already assigned to you. Scan the green card at the vehicle to open the checklist.'
          : 'The key is assigned to you. Choose the correct next step below.';
        showAction('Open Vehicle Checklist', openVehicleAccess);
        returnUnusedKey.hidden = false;
        returnUnusedKey.onclick = () => returnUnused(userEmail);
      } catch (error) {
        statusDiv.textContent = '❌ ' + (error.message || error);
      }
    }
  </script>
</body>
</html>
