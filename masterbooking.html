<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YFNED Master Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.css" rel="stylesheet" />

  <!-- Your global styles (including the sky‐blue feather background) -->
  <link rel="stylesheet" href="style.css" />

  <!-- jQuery & Timepicker -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.js"></script>
  <script src="timepicker-fix.js"></script>

  <style>
    html {
      overflow-y: scroll;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      min-height: 100vh;
    }
    .feather-canvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .page-content {
      max-width: 1580px;
      margin: 2rem auto;
      padding: 0 1.25rem 2rem;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }
    .panel {
      background: white;
      padding: 1.25rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }
    .booking-panel {
      flex: 0 0 480px;
      width: 480px;
      position: sticky;
      top: 1rem;
      z-index: 5;
      overflow: visible;
    }
    .calendar-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .calendar-panel h1 {
      margin-top: 0;
      font-size: 1.35rem;
      flex: 0 0 auto;
    }
    .calendar-and-details {
      display: flex;
      gap: 1rem;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }
    .calendar-section {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #calendar {
      flex: 1;
      min-height: 420px;
    }
    #calendar .fc {
      height: 100%;
    }
    .calendar-panel .fc-col-header-cell-cushion {
      font-size: 0.95rem;
      padding-top: 0.65rem;
      padding-bottom: 0.65rem;
    }
    .calendar-panel .fc-daygrid-day-number {
      font-size: 0.95rem;
      padding: 0.45rem;
    }
    .calendar-panel .fc-daygrid-event {
      font-size: 0.82rem;
      margin-top: 0.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .calendar-panel .fc-daygrid-event .fc-event-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .calendar-panel .fc-toolbar-title {
      font-size: 1.45rem;
    }
    .details-section {
      flex: 0 0 220px;
      width: 220px;
      border-left: 1px solid #ccc;
      padding: 0 1.25rem 0 1rem;
      box-sizing: border-box;
    }
    .details-section h3,
    #selected-date-text {
      margin-top: 0;
      margin-bottom: 0.75rem;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .booking-entry {
      margin-bottom: 1rem;
      line-height: 1.45;
    }
    .booking-entry strong {
      display: block;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #booking-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 0;
      overflow: visible;
    }
    .form-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .booking-panel .form-row {
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.75rem;
      align-items: flex-end;
      overflow: visible;
    }
    .booking-panel .form-row.book-as-row {
      flex-wrap: wrap;
    }
    #booking-form label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      flex: 1;
      min-width: 200px;
    }
    .booking-panel #booking-form label {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      font-size: 0.88rem;
      line-height: 1.3;
    }
    .booking-panel .form-row.book-as-row label {
      flex: 1 1 100%;
    }
    #booking-form input {
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
      width: 100%;
    }
    .booking-panel #booking-form input {
      font-size: 0.95rem;
      min-width: 0;
    }
    .vehicle-picker {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .vehicle-picker-label {
      font-weight: bold;
    }
    .vehicle-select-source {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .vehicle-button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.5rem;
    }
    .booking-panel .vehicle-button-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem;
    }
    .booking-panel .vehicle-option-btn {
      font-size: 0.82rem;
      padding: 0.5rem 0.55rem;
      min-height: 40px;
      line-height: 1.25;
    }
    .vehicle-option-btn {
      border: 2px solid #d1d5db;
      border-left: 8px solid var(--vehicle-accent, #64748b);
      border-radius: 6px;
      background: #f8fafc;
      color: #111827;
      padding: 0.65rem 0.75rem;
      min-height: 44px;
      font: inherit;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .vehicle-option-btn:hover {
      background: #eef6fb;
      border-color: #9ca3af;
      border-left-color: var(--vehicle-accent, #64748b);
    }
    .vehicle-option-btn.active,
    .vehicle-option-btn[aria-checked="true"] {
      background: #1f8fca;
      border-color: #176f9e;
      border-left-color: var(--vehicle-accent, #64748b);
      color: white;
      box-shadow: 0 0 0 3px rgba(31, 143, 202, 0.18);
    }

    .action-button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      max-width: 200px;
      margin-top: 1rem;
    }
    .booking-panel .action-button {
      max-width: none;
      width: 100%;
      margin-top: 0;
    }
    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-button:hover:not(:disabled) {
      background-color: #555;
    }
    .delete-booking {
      margin-top: 0.5rem;
      background: #c00;
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .delete-booking:hover {
      background: #a00;
    }
    .delete-booking.confirming {
      background: #b45309;
    }
    .delete-booking.confirming:hover {
      background: #92400e;
    }

    @media (min-width: 900px) {
      body.live-feather-background {
        background-image: none;
      }
      body.live-feather-background .feather-canvas {
        display: block;
      }
    }
    @media (max-width: 1100px) {
      .page-content {
        flex-direction: column;
      }
      .booking-panel {
        flex: none;
        width: 100%;
        position: static;
      }
      .booking-panel .form-row {
        flex-wrap: wrap;
      }
      .booking-panel #booking-form label {
        flex: 1 1 calc(50% - 0.375rem);
      }
      .booking-panel .form-row.book-as-row label {
        flex: 1 1 100%;
      }
      .calendar-and-details {
        flex-direction: column;
      }
      .details-section {
        flex: 0 0 auto;
        width: auto;
        padding-left: 1rem;
        padding-right: 1.25rem;
      }
    }
  </style>
</head>

<body>

      <form id="booking-form">

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.js"></script>
  <script src="livefeathers.js"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut }
      from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import {
      getDatabase, ref, get, push, set, remove
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAjnCWLnUf8msIUjL0TBdZ1eCAiXMLOwvU",
      authDomain: "yfned-fleet-nfc.firebaseapp.com",
      databaseURL: "https://yfned-fleet-nfc-default-rtdb.firebaseio.com",
      projectId: "yfned-fleet-nfc",
      storageBucket: "yfned-fleet-nfc.appspot.com",
      messagingSenderId: "482363667898",
      appId: "1:482363667898:web:4b0364e891a221e9631983"
    };

    const app       = initializeApp(firebaseConfig);
    const auth      = getAuth(app);
    const db        = getDatabase(app);
    window.initLiveFeatherBackground();

    // DOM refs
    const logoutBtn             = document.getElementById('logout-btn');
    const vehicleSelect         = document.getElementById('vehicle-select');
    const vehicleButtonGrid     = document.getElementById('vehicle-button-grid');
    const bookingStartDateInput = document.getElementById('booking-start-date');
    const bookingEndDateInput   = document.getElementById('booking-end-date');
    const bookingStartTimeInput = document.getElementById('booking-start-time');
    const bookingEndTimeInput   = document.getElementById('booking-end-time');
    const bookingAsInput        = document.getElementById('booking-as');
    const bookVehicleBtn        = document.getElementById('bookVehicleBtn');
    const vehicleHeading        = document.getElementById('vehicle-schedule-heading');
    const selectedDateTextEl    = document.getElementById('selected-date-text');
    const dateBookingsListEl    = document.getElementById('date-bookings-list');
    let lastClickedDayEl        = null;
    let selectedDateIso         = '';
    let calendar                = null;

    function getOrdinalSuffix(day) {
      if (day >= 11 && day <= 13) return 'th';
      switch (day % 10) {
        case 1: return 'st';
        case 2: return 'nd';
        case 3: return 'rd';
        default: return 'th';
      }
    }

    function formatSelectedDateDisplay(dateInput) {
      const date = typeof dateInput === 'string'
        ? new Date(`${dateInput}T12:00:00`)
        : dateInput;
      const month = date.toLocaleString('en-US', { month: 'long' });
      const day = date.getDate();
      return `${month} ${day}${getOrdinalSuffix(day)}`;
    }

    function formatTimeDisplay(date) {
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const period = hours >= 12 ? 'pm' : 'am';
      const hour12 = hours % 12 || 12;
      const minuteText = minutes.toString().padStart(2, '0');
      return `${hour12}:${minuteText}${period}`;
    }

    function capitalizeNamePart(part) {
      if (!part) return '';
      return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
    }

    function getFullNameFromEmail(email) {
      if (!email || !email.includes('@')) return email || 'Unknown';
      const localPart = email.split('@')[0];
      const parts = localPart.split('.').filter(Boolean);
      if (parts.length >= 2) {
        return `${capitalizeNamePart(parts[0])} ${capitalizeNamePart(parts[1])}`;
      }
      return capitalizeNamePart(parts[0]) || localPart;
    }

    function getBookingDisplayName(name) {
      if (!name) return 'Unknown';
      if (name.includes('@')) {
        const localPart = name.split('@')[0];
        const firstName = localPart.split('.')[0];
        if (!firstName) return localPart;
        return capitalizeNamePart(firstName);
      }
      return name;
    }

    function getBookingSidebarName(name) {
      if (!name) return 'Unknown';
      if (name.includes('@')) return getFullNameFromEmail(name);
      return name;
    }

    function setupDeleteBookingHandler() {
      dateBookingsListEl.addEventListener('click', async e => {
        const button = e.target.closest('.delete-booking');
        if (!button || button.disabled) return;

        const id = button.dataset.id;

        if (!button.classList.contains('confirming')) {
          dateBookingsListEl.querySelectorAll('.delete-booking.confirming').forEach(other => {
            other.classList.remove('confirming');
            other.textContent = 'Remove';
          });
          button.classList.add('confirming');
          button.textContent = 'Are You Sure?';
          return;
        }

        button.disabled = true;
        try {
          await remove(ref(db, 'bookings/' + vehicleSelect.value + '/' + id));
          const calEvent = calendar.getEventById(id);
          if (calEvent) calEvent.remove();

          if (selectedDateIso) {
            displayBookingsForDay(
              getEventsForDate(new Date(`${selectedDateIso}T12:00:00`)),
              selectedDateIso
            );
          }
        } catch (err) {
          button.disabled = false;
          button.classList.remove('confirming');
          button.textContent = 'Remove';
          alert('Could not remove booking. Please try again.');
        }
      });
    }

    // list of all form fields to watch for “input” → re-enable
    const formInputs = [
      vehicleSelect,
      bookingStartDateInput,
      bookingEndDateInput,
      bookingStartTimeInput,
      bookingEndTimeInput,
      bookingAsInput
    ];

    function syncVehicleButtons() {
      vehicleButtonGrid.querySelectorAll('.vehicle-option-btn').forEach(btn => {
        const isSelected = btn.dataset.value === vehicleSelect.value;
        btn.classList.toggle('active', isSelected);
        btn.setAttribute('aria-checked', String(isSelected));
      });
    }

    function setVehicleSelection(value) {
      vehicleSelect.value = value;
      vehicleSelect.dispatchEvent(new Event('input', { bubbles: true }));
      vehicleSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function vehicleAccentColor(option) {
      const vehicle = `${option.value} ${option.textContent}`.toLowerCase();

      if (vehicle.includes('red traverse')) return '#d4282f';
      if (vehicle.includes('black traverse')) return '#2c3e50';
      if (vehicle.includes('shadow silverado') || vehicle.includes('silverado')) return '#f1c40f';
      if (vehicle.includes('cn360') || vehicle.includes('nutrition traverse')) return '#690000ff';
      if (vehicle.includes('grand caravan') || vehicle.includes('cn468')) return '#ff009dff';
      if (vehicle.includes('white terrain') || vehicle.includes('cn466')) return '#c83771ff';
      if (vehicle.includes('black terrain') || vehicle.includes('cn467')) return '#ff7299ff';
      if (vehicle.includes('green mtu trailblazer') || vehicle.includes('trailblazer')) return '#27ae60';
      if (vehicle.includes('cs266')) return '#303030ff';
      if (vehicle.includes('ct008')) return '#5e5e5eff';
      if (vehicle.includes('c443c')) return '#919191ff';
      if (vehicle.includes('c444c')) return '#c6c6c6ff';
      if (vehicle.includes('blue traverse') || vehicle.includes('ct073')) return '#0055d4ff';
      if (vehicle.includes('black buick')) return '#8e44ad';
      if (vehicle.includes('ford transit')) return '#fd9644';
      if (vehicle.includes('grey traverse')) return '#6b7280';

      return '#64748b';
    }

    function initVehicleButtons() {
      vehicleButtonGrid.innerHTML = '';

      [...vehicleSelect.options].forEach(option => {
        if (option.hidden) return;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'vehicle-option-btn';
        button.dataset.value = option.value;
        button.textContent = option.textContent;
        button.setAttribute('role', 'radio');
        button.style.setProperty('--vehicle-accent', vehicleAccentColor(option));
        button.addEventListener('click', () => setVehicleSelection(option.value));
        vehicleButtonGrid.appendChild(button);
      });

      syncVehicleButtons();
    }

    onAuthStateChanged(auth, user => {
      if (!user) return window.location.href = 'index.html';
      logoutBtn.style.display = 'inline-block';

      // init timepicker dropdowns
      $('#booking-start-time, #booking-end-time').timepicker({
        timeFormat: 'h:mm p',
        interval: 30,
        minTime: '6:00am',
        maxTime: '9:00pm',
        dynamic: false,
        dropdown: true,
        scrollbar: true
      });

      let timepickerOpenCount = 0;
      let cachedScrollbarWidth = null;

      function getScrollbarWidth() {
        if (cachedScrollbarWidth !== null) return cachedScrollbarWidth;
        const outer = document.createElement('div');
        outer.style.cssText = 'visibility:hidden;overflow:scroll;width:100px;position:absolute;top:-9999px';
        document.body.appendChild(outer);
        const inner = document.createElement('div');
        inner.style.width = '100%';
        outer.appendChild(inner);
        cachedScrollbarWidth = outer.offsetWidth - inner.offsetWidth;
        outer.remove();
        return cachedScrollbarWidth;
      }

      function lockPageForTimepicker() {
        timepickerOpenCount++;
        if (timepickerOpenCount === 1) {
          const scrollbarWidth = getScrollbarWidth();
          document.documentElement.style.setProperty('--scrollbar-width', `${scrollbarWidth}px`);
          document.documentElement.classList.add('timepicker-open');
          document.body.classList.add('timepicker-open');
        }
      }
      function unlockPageForTimepicker() {
        timepickerOpenCount = Math.max(0, timepickerOpenCount - 1);
        if (timepickerOpenCount === 0) {
          document.documentElement.classList.remove('timepicker-open');
          document.body.classList.remove('timepicker-open');
          document.documentElement.style.removeProperty('--scrollbar-width');
        }
      }
      setupFleetTimepicker('#booking-start-time, #booking-end-time', lockPageForTimepicker, unlockPageForTimepicker);

      // re-enable “Book Vehicle” as soon as any field changes
      formInputs.forEach(el =>
        el.addEventListener('input', () => bookVehicleBtn.disabled = false)
      );

      initVehicleButtons();
      setupDeleteBookingHandler();
      initCalendar();
      updateVehicleHeading(vehicleSelect.value);

      vehicleSelect.addEventListener('change', async () => {
        syncVehicleButtons();
        await updateVehicleHeading(vehicleSelect.value);
        calendar.refetchEvents();
      });

      bookVehicleBtn.addEventListener('click', async e => {
        e.preventDefault();
        await handleMultiDayBooking();
      });

      logoutBtn.addEventListener('click', () => signOut(auth));
    });

    function initCalendar() {
      calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {
          initialView: 'dayGridMonth',
          timeZone: 'local',
          height: '100%',
          expandRows: true,
          events: fetchVehicleBookings,
          displayEventTime: false,
          dateClick: info => {
            if (lastClickedDayEl) lastClickedDayEl.style.backgroundColor = '';
            info.dayEl.style.backgroundColor = 'lightblue';
            lastClickedDayEl = info.dayEl;

            selectedDateIso = info.dateStr;
            selectedDateTextEl.textContent = formatSelectedDateDisplay(info.dateStr);
            displayBookingsForDay(
              getEventsForDate(info.date),
              info.dateStr
            );
            bookingStartDateInput.value = info.dateStr;
          }
        }
      );
      calendar.render();
      requestAnimationFrame(() => calendar.updateSize());
    }

    function syncCalendarSize() {
      if (calendar) calendar.updateSize();
    }

    window.addEventListener('resize', syncCalendarSize);

    async function updateVehicleHeading(name) {
      const snap = await get(ref(db, 'vehicles/' + name));
      const status = snap.exists() && snap.val().status === 'signedOut'
        ? `Signed Out by ${snap.val().keyHeldBy || '—'}`
        : 'Available';
      vehicleHeading.textContent = `${name} schedule: ${status}`;
    }

    async function fetchVehicleBookings(arg, success) {
      const vehicle = vehicleSelect.value;
      const snap = await get(ref(db, 'bookings/' + vehicle));
      if (!snap.exists()) return success([]);
      const evs = Object.entries(snap.val()).map(([id,b]) => ({
        id,
        title: getBookingDisplayName(b.userName),
        start: new Date(b.startTimeISO),
        end:   new Date(b.endTimeISO),
        extendedProps: { creator: b.userName }
      }));
      success(evs);
    }

    function getEventsForDate(date) {
      const dayStart = new Date(date).setHours(0,0,0,0);
      const dayEnd   = new Date(dayStart);
      dayEnd.setDate(dayEnd.getDate()+1);
      return calendar.getEvents().filter(ev =>
        ev.start < dayEnd && ev.end > dayStart
      );
    }

    function displayBookingsForDay(events, dateStr) {
      if (!events.length) {
        dateBookingsListEl.textContent = 'No bookings.';
        return;
      }
      dateBookingsListEl.innerHTML = events.map(ev => {
        const displayName = getBookingSidebarName(ev.extendedProps.creator);
        return `
          <div class="booking-entry" data-id="${ev.id}">
            <strong title="${ev.extendedProps.creator}">${displayName}</strong>
            Start: ${formatTimeDisplay(ev.start)}<br>
            End: ${formatTimeDisplay(ev.end)}<br>
            <button class="delete-booking" data-id="${ev.id}">Remove</button>
          </div>
        `;
      }).join('');
    }

    function toTimestamp(dateStr, timeStr) {
      const [Y,M,D] = dateStr.split('-').map(Number);
      let [t,mod]   = timeStr.split(' ');
      let [h,m]     = t.split(':').map(Number);
      if (mod==='PM' && h!==12) h+=12;
      if (mod==='AM' && h===12) h=0;
      return new Date(Y,M-1,D,h,m).getTime();
    }

    async function isBookingOverlapping(vehicle,newStart,newEnd) {
      const snap = await get(ref(db,'bookings/'+vehicle));
      if (!snap.exists()) return false;
      return Object.values(snap.val()).some(b => {
        const s = new Date(b.startTimeISO).getTime();
        const e = new Date(b.endTimeISO).getTime();
        return newStart < e && newEnd > s;
      });
    }

    async function isVehicleOutForMaintenance(vehicle) {
      const snap = await get(ref(db, 'vehicles/' + vehicle));
      return snap.exists() && snap.val().maintenanceStatus === 'outForMaintenance';
    }

    // allow weekends + free‐form “Book As”
    async function handleMultiDayBooking() {
      const vehicle = vehicleSelect.value;
      if (!vehicle) {
        alert('No vehicle selected.');
        return;
      }
      if (await isVehicleOutForMaintenance(vehicle)) {
        alert('This vehicle is currently out for maintenance and cannot be booked.');
        return;
      }
      const asUser = bookingAsInput.value.trim();
      if (!asUser) {
        alert('Please enter who you’re booking as.');
        return;
      }

      const startVal = bookingStartDateInput.value;
      const endVal   = bookingEndDateInput.value || startVal;
      const startT   = bookingStartTimeInput.value;
      const endT     = bookingEndTimeInput.value;

      if (!startVal || !startT || !endT) {
        alert('Please provide dates and times.');
        return;
      }

      const [y1,m1,d1] = startVal.split('-').map(Number);
      const [y2,m2,d2] = endVal.split('-').map(Number);

      let cur  = new Date(y1,m1-1,d1);
      const last = new Date(y2,m2-1,d2);
      const toCreate = [];

      if (cur > last) {
        alert('Start date cannot be after end date.');
        return;
      }

      while (cur <= last) {
        const Y = cur.getFullYear(),
              Mo=String(cur.getMonth()+1).padStart(2,'0'),
              Da=String(cur.getDate()).padStart(2,'0'),
              dateStr = `${Y}-${Mo}-${Da}`,
              startTS = toTimestamp(dateStr, startT),
              endTS   = toTimestamp(dateStr, endT);

        if (endTS <= startTS) {
          alert(`End time must be after start time on ${dateStr}.`);
          return;
        }
        if (await isBookingOverlapping(vehicle,startTS,endTS)) {
          alert(`Conflict on ${dateStr}. Booking aborted.`);
          return;
        }

        toCreate.push({
          userName:     asUser,
          date:         dateStr,
          startTime:    startT,
          endTime:      endT,
          startTimeISO: new Date(startTS).toISOString(),
          endTimeISO:   new Date(endTS).toISOString()
        });
        cur.setDate(cur.getDate()+1);
      }

      for (const b of toCreate) {
        await set(push(ref(db,'bookings/'+vehicle)), b);
      }

      alert(`Booked ${vehicle} as ${asUser}!`);
      calendar.refetchEvents();

      if (selectedDateIso) {
        displayBookingsForDay(
          getEventsForDate(new Date(`${selectedDateIso}T12:00:00`)),
          selectedDateIso
        );
      }

      // disable & clear form so they can’t double-click
      bookVehicleBtn.disabled   = true;
      bookingAsInput.value      = '';
    }
  </script>
</body>
</html>
