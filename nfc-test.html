<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NFC Vehicle Access Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #5cbde5;
    }
    #main-content {
      display: none;
      margin-top: 2rem;
    }
    #vehicle-name {
      font-size: 1.5rem;
      font-weight: bold;
    }
    button {
      font-size: 1.2rem;
      padding: 1rem 2rem;
      margin-top: 2rem;
      font-weight: bold;
    }
    #message {
      margin-top: 1rem;
      font-weight: bold;
      color: darkred;
    }
    #checklist-container {
      display: none;
      max-width: 820px;
      margin: 2rem auto 0;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.12);
      text-align: left;
    }
    #checklist-container h2 {
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    #checklist-container p {
      margin-top: 0;
      color: #444;
    }
    .checklist-grid {
      display: grid;
      gap: 0.85rem;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border: 1px solid #d6dee7;
      border-radius: 10px;
      background: #f8fbff;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .checklist-item-text {
      flex: 1 1 auto;
      font-weight: 600;
      color: #1f2937;
    }
    .checklist-item-copy {
      display: grid;
      gap: 0.35rem;
      flex: 1 1 auto;
    }
    .checklist-item-help {
      font-size: 0.88rem;
      font-weight: 500;
      color: #64748b;
    }
    .checklist-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0;
    }
    .checklist-choice {
      margin-top: 0;
      padding: 0.7rem 1rem;
      border: 1px solid #b7c5d6;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .checklist-choice.functional.selected {
      background: #dff6e8;
      border-color: #32a86b;
      color: #166534;
    }
    .checklist-choice.repair.selected {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }
    .checklist-supplies {
      align-items: flex-start;
    }
    .checklist-supplies-options {
      display: grid;
      gap: 0.45rem;
      min-width: 240px;
    }
    .checklist-supply-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.92rem;
      color: #1f2937;
    }
    .checklist-supply-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #2563eb;
    }
    .checklist-supplies-status {
      font-size: 0.88rem;
      color: #64748b;
    }
    .checklist-supplies-status.needs-repair {
      color: #991b1b;
      font-weight: 600;
    }
    .checklist-supplies-status.functional {
      color: #166534;
      font-weight: 600;
    }
    #checklist-status {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #555;
    }
    @media (max-width: 720px) {
      .checklist-item {
        align-items: flex-start;
        flex-direction: column;
      }
      .checklist-actions {
        width: 100%;
      }
      .checklist-choice {
        flex: 1 1 180px;
      }
      .checklist-supplies-options {
        width: 100%;
        min-width: 0;
      }
    }
    #test-controls {
      max-width: 820px;
      margin: 1.25rem auto 0;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.12);
      text-align: left;
    }
    #test-controls h2 {
      margin: 0 0 0.75rem;
    }
    .test-controls-row {
      display: flex;
      gap: 1rem;
      flex-wrap: nowrap;
      align-items: center;
    }
    .test-control-button {
      min-width: 220px;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: #111;
    }
    .test-vehicle-picker {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
      flex: 1 1 300px;
    }
    .test-vehicle-picker label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
    }
    .test-vehicle-picker select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.8rem 0.9rem;
      font: inherit;
      background: white;
    }
    .test-control-button.frontdesk {
      background: #e7bbd2;
    }
    .test-control-button.withstaff {
      background: #e0e257;
    }
    .test-control-button.available {
      background: #2ecc71;
    }
    .test-control-button.signedout {
      background: #5cbde5;
    }
    #test-controls-status {
      margin-top: 0.75rem;
      color: #555;
      font-size: 0.95rem;
    }
    #return-notes-container {
      display: none;
      max-width: 760px;
      margin: 1.5rem auto 0;
      text-align: left;
    }
    #return-notes-container label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #222;
    }
    #return-comments {
      width: 100%;
      min-height: 120px;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #b8b8b8;
      box-sizing: border-box;
      resize: vertical;
      font: inherit;
    }
  </style>
</head>
<body>

<h1>YFNED Vehicle Access via NFC Test</h1>
<p id="auth-status">Checking login...</p>

<div id="main-content">
  <div id="vehicle-name"></div>
  <div id="test-controls">
    <h2>Test State Overrides</h2>
    <div class="test-controls-row">
      <button id="test-key-btn" class="test-control-button frontdesk" type="button"></button>
      <button id="test-status-btn" class="test-control-button available" type="button"></button>
      <div class="test-vehicle-picker">
        <label for="test-vehicle-select">Vehicle To Test</label>
        <select id="test-vehicle-select"></select>
      </div>
    </div>
    <div id="test-controls-status"></div>
  </div>
  <div id="checklist-container">
    <h2>Vehicle Checklist</h2>
    <p>Complete every item before signing out the vehicle.</p>
    <div id="checklist-grid" class="checklist-grid"></div>
    <div id="checklist-status">0 / 12 completed</div>
  </div>
  <div id="return-notes-container">
    <label for="return-comments">Comments, Incidents, or Corrective Actions Needed?</label>
    <textarea id="return-comments" placeholder="Describe any issues, incidents, or maintenance concerns noticed during use."></textarea>
  </div>
  <button id="actionBtn"></button>
  <div id="message"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
  import { getDatabase, ref, get, update, push, set } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAjnCWLnUf8msIUjL0TBdZ1eCAiXMLOwvU",
    authDomain: "yfned-fleet-nfc.firebaseapp.com",
    databaseURL: "https://yfned-fleet-nfc-default-rtdb.firebaseio.com",
    projectId: "yfned-fleet-nfc",
    storageBucket: "yfned-fleet-nfc.appspot.com",
    messagingSenderId: "482363667898",
    appId: "1:482363667898:web:4b0364e891a221e9631983",
    measurementId: "G-LK66DQVKW4"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const DEFAULT_TEST_VEHICLE = 'Test NFC Card';
  const urlParams = new URLSearchParams(window.location.search);
  const vehicleParam = urlParams.get('vehicle');
  const vehicle = decodeURIComponent(vehicleParam || DEFAULT_TEST_VEHICLE);
  const authStatus = document.getElementById('auth-status');
  const mainContent = document.getElementById('main-content');
  const vehicleNameEl = document.getElementById('vehicle-name');
  const actionBtn = document.getElementById('actionBtn');
  const messageEl = document.getElementById('message');
  const checklistContainer = document.getElementById('checklist-container');
  const checklistGrid = document.getElementById('checklist-grid');
  const checklistStatus = document.getElementById('checklist-status');
  const testKeyBtn = document.getElementById('test-key-btn');
  const testStatusBtn = document.getElementById('test-status-btn');
  const testVehicleSelect = document.getElementById('test-vehicle-select');
  const testControlsStatus = document.getElementById('test-controls-status');
  const returnNotesContainer = document.getElementById('return-notes-container');
  const returnCommentsInput = document.getElementById('return-comments');

  let currentUser = null;
  let currentVehicle = vehicle;
  const legacyVehicleNameMap = {
    '03-21 2021 Grey Traverse CN360 Nutrition Team Only': '03-21 2021 Grey Traverse CN360',
    '06-21 2020 Grey Grand Caravan CN468 Early Years Only': '06-21 2020 Grey Grand Caravan CN468',
    '07-21 2021 White Terrain CN466 Early Years Only': '07-21 2021 White Terrain CN466',
    '08-21 2021 Black Terrain CN467 Early Years Only': '08-21 2021 Black Terrain CN467',
    '10-24 2025 Green MTU Trailblazer C838B': '10-24 2025 Green Trailblazer C838B',
    '18-25 2025 Ford Transit Van - C115C': '18-25 2025 Ford Transit Van C115C'
  };
  const vehiclePickerLabels = {
    '01-20 2021 Red Traverse CM335': 'Red Traverse CM335',
    '02-20 2021 Black Traverse CM366': 'Black Traverse CM366',
    '03-21 2021 Grey Traverse CN360': 'Grey Traverse CN360',
    '03-21 2021 Grey Traverse CN360 Nutrition Team Only': 'Grey Traverse CN360',
    '04-21 2021 Shadow Silverado 1500 CM695': 'Shadow Silverado CM695',
    '06-21 2020 Grey Grand Caravan CN468': 'Grey Grand Caravan CN468',
    '06-21 2020 Grey Grand Caravan CN468 Early Years Only': 'Grey Grand Caravan CN468',
    '07-21 2021 White Terrain CN466': 'White Terrain CN466',
    '07-21 2021 White Terrain CN466 Early Years Only': 'White Terrain CN466',
    '08-21 2021 Black Terrain CN467': 'Black Terrain CN467',
    '08-21 2021 Black Terrain CN467 Early Years Only': 'Black Terrain CN467',
    '10-24 2025 Green Trailblazer C838B': 'Green Trailblazer C838B',
    '10-24 2025 Green MTU Trailblazer C838B': 'Green Trailblazer C838B',
    '11-24 2024 Grey Traverse CS266': 'Grey Traverse CS266',
    '13-24 2024 Grey Traverse CT008': 'Grey Traverse CT008',
    '14-24 2024 Grey Traverse C443C': 'Grey Traverse C443C',
    '15-24 2024 Grey Traverse C444C': 'Grey Traverse C444C',
    '16-24 2024 Blue Traverse CT073': 'Blue Traverse CT073',
    '17-25 2025 Black Buick Envision CV294': 'Black Buick Envision CV294',
    '18-25 2025 Ford Transit Van C115C': 'Ford Transit Van C115C',
    '18-25 2025 Ford Transit Van - C115C': 'Ford Transit Van C115C'
  };
  const checklistItems = [
    { type: 'buttons', question: 'Emergency and Regular brakes' },
    { type: 'buttons', question: 'Windshield and Mirrors' },
    { type: 'buttons', question: 'Doors and Windows' },
    { type: 'buttons', question: 'Tires (wear and pressure)' },
    { type: 'buttons', question: 'Headlights, Taillights, Turn Signals, Hazard Lights' },
    { type: 'buttons', question: 'Heater/AC' },
    { type: 'buttons', question: 'Windshield Wipers' },
    { type: 'buttons', question: 'Horn' },
    { type: 'buttons', question: 'Oil, Coolant, Washer Fluid Levels' },
    { type: 'buttons', question: 'Seatbelts' },
    { type: 'buttons', question: 'Dashboard Screen' },
    {
      type: 'presence',
      question: 'Confirm these are present in the vehicle',
      options: [
        'REGISTRATION',
        'FIRST AID KIT',
        'BLOCK HEATER PLUG',
        'EXTRA WASHER FLUID',
        'EXTRA OIL'
      ]
    }
  ];
  let checklistSelections = [];

  function createChecklistState() {
    return checklistItems.map(item => {
      if (item.type === 'presence') {
        return {
          status: null,
          touched: false,
          selectedOptions: new Array(item.options.length).fill(false),
          missingItems: []
        };
      }

      return {
        status: null
      };
    });
  }

  function renderChecklist() {
    checklistGrid.innerHTML = '';
    checklistSelections = createChecklistState();
    checklistItems.forEach((itemConfig, index) => {
      const item = document.createElement('div');
      item.className = 'checklist-item';

      if (itemConfig.type === 'presence') {
        item.classList.add('checklist-supplies');

        const copy = document.createElement('div');
        copy.className = 'checklist-item-copy';

        const text = document.createElement('div');
        text.className = 'checklist-item-text';
        text.textContent = itemConfig.question;

        const help = document.createElement('div');
        help.className = 'checklist-item-help checklist-supplies-status';
        help.textContent = 'Check each item that is present. Any unchecked item will be logged as needing repair.';

        copy.appendChild(text);
        copy.appendChild(help);

        const options = document.createElement('div');
        options.className = 'checklist-supplies-options';

        itemConfig.options.forEach((optionLabel, optionIndex) => {
          const optionRow = document.createElement('label');
          optionRow.className = 'checklist-supply-option';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.addEventListener('change', () => updatePresenceSelection(index, optionIndex, checkbox.checked));

          const optionText = document.createElement('span');
          optionText.textContent = optionLabel;

          optionRow.appendChild(checkbox);
          optionRow.appendChild(optionText);
          options.appendChild(optionRow);
        });

        item.appendChild(copy);
        item.appendChild(options);
      } else {
        const text = document.createElement('div');
        text.className = 'checklist-item-text';
        text.textContent = itemConfig.question;

        const actions = document.createElement('div');
        actions.className = 'checklist-actions';

        const functionalButton = document.createElement('button');
        functionalButton.type = 'button';
        functionalButton.className = 'checklist-choice functional';
        functionalButton.textContent = 'Functional';
        functionalButton.addEventListener('click', () => setChecklistSelection(index, 'functional'));

        const repairButton = document.createElement('button');
        repairButton.type = 'button';
        repairButton.className = 'checklist-choice repair';
        repairButton.textContent = 'Needs Repair';
        repairButton.addEventListener('click', () => setChecklistSelection(index, 'needsRepair'));

        actions.appendChild(functionalButton);
        actions.appendChild(repairButton);
        item.appendChild(text);
        item.appendChild(actions);
      }

      checklistGrid.appendChild(item);
    });
    updateChecklistProgress();
  }

  function setChecklistSelection(index, value) {
    checklistSelections[index].status = value;
    const item = checklistGrid.children[index];
    if (!item) {
      return;
    }

    const functionalButton = item.querySelector('.checklist-choice.functional');
    const repairButton = item.querySelector('.checklist-choice.repair');
    functionalButton.classList.toggle('selected', value === 'functional');
    repairButton.classList.toggle('selected', value === 'needsRepair');
    updateChecklistProgress();
  }

  function updatePresenceSelection(itemIndex, optionIndex, isChecked) {
    const itemState = checklistSelections[itemIndex];
    const itemConfig = checklistItems[itemIndex];
    itemState.touched = true;
    itemState.selectedOptions[optionIndex] = isChecked;
    itemState.missingItems = itemConfig.options.filter((_, idx) => !itemState.selectedOptions[idx]);
    itemState.status = itemState.missingItems.length === 0 ? 'functional' : 'needsRepair';

    const item = checklistGrid.children[itemIndex];
    if (item) {
      const statusEl = item.querySelector('.checklist-supplies-status');
      if (statusEl) {
        statusEl.classList.remove('functional', 'needs-repair');
        if (itemState.status === 'functional') {
          statusEl.textContent = 'Functional: all required items are present.';
          statusEl.classList.add('functional');
        } else {
          const missingLabel = itemState.missingItems.join(', ');
          statusEl.textContent = `Needs Repair: missing ${missingLabel}.`;
          statusEl.classList.add('needs-repair');
        }
      }
    }

    updateChecklistProgress();
  }

  function getChecklistStatus(itemState) {
    if (!itemState) {
      return null;
    }
    if (Object.prototype.hasOwnProperty.call(itemState, 'touched') && !itemState.touched) {
      return null;
    }
    return itemState.status;
  }

  function getChecklistRepairNotes() {
    return checklistItems.flatMap((itemConfig, index) => {
      const itemState = checklistSelections[index];
      const status = getChecklistStatus(itemState);
      if (status !== 'needsRepair') {
        return [];
      }

      if (itemConfig.type === 'presence') {
        if (!itemState.missingItems.length) {
          return [];
        }
        return [`${itemConfig.question}: missing ${itemState.missingItems.join(', ')}`];
      }

      return [itemConfig.question];
    });
  }

  function getChecklistLogPayload() {
    return checklistItems.map((itemConfig, index) => {
      const itemState = checklistSelections[index];
      const status = getChecklistStatus(itemState);
      const payload = {
        question: itemConfig.question,
        status
      };

      if (itemConfig.type === 'presence') {
        payload.checkedItems = itemConfig.options.filter((_, optionIndex) => itemState.selectedOptions[optionIndex]);
        payload.missingItems = [...itemState.missingItems];
      }

      return payload;
    });
  }

  function updateChecklistProgress() {
    const total = checklistItems.length;
    const completed = checklistSelections.filter(itemState => Boolean(getChecklistStatus(itemState))).length;
    checklistStatus.textContent = `${completed} / ${total} completed`;
    if (actionBtn.dataset.mode === 'signout') {
      actionBtn.disabled = completed !== total;
    }
  }

  function resetChecklist() {
    checklistSelections = createChecklistState();
    checklistGrid.querySelectorAll('.checklist-choice').forEach(button => {
      button.classList.remove('selected');
    });
    checklistGrid.querySelectorAll('.checklist-supply-option input').forEach(input => {
      input.checked = false;
    });
    checklistGrid.querySelectorAll('.checklist-supplies-status').forEach(statusEl => {
      statusEl.textContent = 'Check each item that is present. Any unchecked item will be logged as needing repair.';
      statusEl.classList.remove('functional', 'needs-repair');
    });
    updateChecklistProgress();
  }

  function renderTestControls(vehicleData) {
    const keyStatus = vehicleData?.keyStatus || 'atFrontDesk';
    const vehicleStatus = vehicleData?.status || 'available';
    const keyHeldBy = vehicleData?.keyHeldBy || 'nobody';
    const signedOutBy = vehicleData?.CurrentlySignedOutBy || 'nobody';

    if (keyStatus === 'withStaff') {
      testKeyBtn.textContent = 'Out With Staff Member';
      testKeyBtn.className = 'test-control-button withstaff';
    } else {
      testKeyBtn.textContent = 'At The Front Desk';
      testKeyBtn.className = 'test-control-button frontdesk';
    }

    if (vehicleStatus === 'signedOut') {
      testStatusBtn.textContent = 'Signed Out by Staff';
      testStatusBtn.className = 'test-control-button signedout';
    } else {
      testStatusBtn.textContent = 'Available';
      testStatusBtn.className = 'test-control-button available';
    }

    testControlsStatus.textContent =
      `Key holder: ${keyHeldBy}. Vehicle signed out by: ${signedOutBy}.`;
  }

  function getDatabaseVehicleName(name) {
    return legacyVehicleNameMap[name] || name;
  }

  function getVehicleDisplayLabel(name) {
    return vehiclePickerLabels[name] || name;
  }

  currentVehicle = getDatabaseVehicleName(currentVehicle);

  function renderVehicleLabel() {
    const displayVehicle = getVehicleDisplayLabel(currentVehicle);
    vehicleNameEl.textContent = vehicleParam
      ? `Vehicle: ${displayVehicle}`
      : `Vehicle: ${displayVehicle} (default test vehicle)`;
  }

  async function populateVehiclePicker() {
    const snap = await get(ref(db, 'vehicles'));
    const vehicles = snap.exists() ? Object.keys(snap.val()) : [];
    const optionValues = [];

    vehicles.forEach(vehicleName => {
      const databaseVehicleName = getDatabaseVehicleName(vehicleName);
      if (!optionValues.includes(databaseVehicleName)) {
        optionValues.push(databaseVehicleName);
      }
    });

    if (!optionValues.includes(DEFAULT_TEST_VEHICLE)) {
      optionValues.unshift(DEFAULT_TEST_VEHICLE);
    }

    testVehicleSelect.innerHTML = '';
    optionValues.forEach(vehicleName => {
      const option = document.createElement('option');
      option.value = vehicleName;
      option.textContent = getVehicleDisplayLabel(vehicleName);
      testVehicleSelect.appendChild(option);
    });

    if (!optionValues.includes(currentVehicle)) {
      currentVehicle = optionValues[0] || DEFAULT_TEST_VEHICLE;
    }
    testVehicleSelect.value = currentVehicle;
    renderVehicleLabel();
  }

  async function logVehicleAction(vehicleName, action, details = {}) {
    const logRef = push(ref(db, `vehicleLogs/${vehicleName}`));
    await set(logRef, {
      userEmail: currentUser?.email || null,
      action,
      timestamp: Date.now(),
      ...details
    });
  }

  async function logMaintenanceComment(vehicleName, comment) {
    const entryRef = push(ref(db, `maintenanceLogs/${vehicleName}`));
    await set(entryRef, {
      userEmail: currentUser?.email || null,
      comment,
      timestamp: Date.now()
    });
  }

  async function logChecklistRepairItems(vehicleName, repairItems) {
    if (!repairItems.length) {
      return;
    }

    const entryRef = push(ref(db, `checklistLogs/${vehicleName}`));
    await set(entryRef, {
      userEmail: currentUser?.email || null,
      repairItems,
      timestamp: Date.now()
    });
  }

  async function toggleTestKeyStatus() {
    const vehicleRef = ref(db, 'vehicles/' + currentVehicle);
    const snap = await get(vehicleRef);
    if (!snap.exists()) {
      messageEl.textContent = 'Vehicle not found in database.';
      return;
    }

    const data = snap.val();
    const toStaff = (data.keyStatus || 'atFrontDesk') === 'atFrontDesk';
    const updates = {
      keyStatus: toStaff ? 'withStaff' : 'atFrontDesk',
      keyHeldBy: toStaff ? currentUser.email : null,
      lastKeyChange: Date.now(),
      alarm: toStaff
    };

    if (!toStaff) {
      updates.status = 'available';
      updates.CurrentlySignedOutBy = null;
    }

    await update(vehicleRef, updates);
    await checkVehicleStatusAndRender(currentVehicle);
  }

  async function toggleTestVehicleStatus() {
    const vehicleRef = ref(db, 'vehicles/' + currentVehicle);
    const snap = await get(vehicleRef);
    if (!snap.exists()) {
      messageEl.textContent = 'Vehicle not found in database.';
      return;
    }

    const data = snap.val();
    const isOut = (data.status || 'available') === 'available';
    const updates = {
      status: isOut ? 'signedOut' : 'available',
      CurrentlySignedOutBy: isOut ? currentUser.email : null,
      alarm: isOut ? false : (data.alarm === true)
    };

    await update(vehicleRef, updates);
    await checkVehicleStatusAndRender(currentVehicle);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      authStatus.innerHTML = `Please <a href="index.html">log in</a> to access vehicle.`;
    } else {
      currentUser = user;
      authStatus.style.display = 'none';
      mainContent.style.display = 'block';
      renderChecklist();
      await populateVehiclePicker();
      testKeyBtn.addEventListener('click', toggleTestKeyStatus);
      testStatusBtn.addEventListener('click', toggleTestVehicleStatus);
      testVehicleSelect.addEventListener('change', async () => {
        currentVehicle = testVehicleSelect.value;
        renderVehicleLabel();
        messageEl.textContent = '';
        returnCommentsInput.value = '';
        await checkVehicleStatusAndRender(currentVehicle);
      });

      await checkVehicleStatusAndRender(currentVehicle);
    }
  });

  async function checkVehicleStatusAndRender(vehicleName) {
    const vehicleRef = ref(db, 'vehicles/' + vehicleName);
    const snap = await get(vehicleRef);

    if (!snap.exists()) {
      messageEl.textContent = 'Vehicle not found in database.';
      actionBtn.style.display = 'none';
      return;
    }

    const data = snap.val();
    const signedOutBy = data.CurrentlySignedOutBy || null;
    renderTestControls(data);
    messageEl.textContent = '';

    if (data.status === 'available') {
      checklistContainer.style.display = 'block';
      returnNotesContainer.style.display = 'none';
      returnCommentsInput.value = '';
      resetChecklist();
      actionBtn.textContent = 'Sign Out Vehicle';
      actionBtn.dataset.mode = 'signout';
      actionBtn.disabled = true;
      actionBtn.onclick = () => signOutVehicle(vehicleName);
    } else if (data.status === 'signedOut' && signedOutBy === currentUser.email) {
      checklistContainer.style.display = 'none';
      returnNotesContainer.style.display = 'block';
      actionBtn.textContent = 'Return Vehicle';
      actionBtn.dataset.mode = 'return';
      actionBtn.disabled = false;
      actionBtn.onclick = () => returnVehicle(vehicleName);
    } else {
      checklistContainer.style.display = 'none';
      returnNotesContainer.style.display = 'none';
      returnCommentsInput.value = '';
      actionBtn.dataset.mode = 'hidden';
      actionBtn.disabled = true;
      actionBtn.style.display = 'none';
      messageEl.textContent = `This vehicle is currently signed out by ${signedOutBy}.`;
    }
    actionBtn.style.display = '';
  }

  async function signOutVehicle(vehicleName) {
    const vehicleRef = ref(db, 'vehicles/' + vehicleName);
    const snap = await get(vehicleRef);

    if (!snap.exists()) {
      messageEl.textContent = 'Vehicle not found in database.';
      actionBtn.style.display = 'none';
      return;
    }

    const vehicleData = snap.val();

    if (vehicleData.keyHeldBy !== currentUser.email && vehicleData.keyStatus === 'withStaff') {
      messageEl.textContent = 'Cannot sign out vehicle unless the front desk handed the keys to you.';
      actionBtn.style.display = 'none';
      await logVehicleAction(vehicleName, 'vehicleSignOutDenied', {
        reason: 'keyHeldByMismatch',
        keyHeldBy: vehicleData.keyHeldBy || null
      });
      return;
    }

    if (vehicleData.keyStatus !== 'withStaff') {
      messageEl.textContent = 'Cannot sign out vehicle until keys are handed over by front desk.';
      actionBtn.style.display = 'none';
      return;
    }

    const now = new Date();
    const localNowTS = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      now.getHours(),
      now.getMinutes(),
      now.getSeconds()
    ).getTime();

    const bookingSnap = await get(ref(db, 'bookings/' + vehicleName));
    if (bookingSnap.exists()) {
      const allBookings = bookingSnap.val();
      for (const bId in allBookings) {
        const b = allBookings[bId];
        const startTS = new Date(b.startTimeISO).getTime();
        const endTS = new Date(b.endTimeISO).getTime();

        if (localNowTS >= startTS && localNowTS < endTS) {
          if (b.userName !== currentUser.email) {
            messageEl.textContent = `Vehicle is currently booked by ${b.userName}. You can't sign it out.`;
            actionBtn.style.display = 'none';
            return;
          }
          break;
        }
      }
    }

    await update(vehicleRef, {
      status: 'signedOut',
      CurrentlySignedOutBy: currentUser.email,
      alarm: false
    });

    const checklistRepairItems = getChecklistRepairNotes();
    await logChecklistRepairItems(vehicleName, checklistRepairItems);

    await logVehicleAction(vehicleName, 'signedOut', {
      keyHeldBy: vehicleData.keyHeldBy || null,
      checklistCompleted: true,
      checklistItemCount: checklistItems.length,
      checklistResponses: getChecklistLogPayload()
    });

    messageEl.textContent = `Signed out ${vehicleName}.`;
    actionBtn.style.display = 'none';
  }

  async function returnVehicle(vehicleName) {
    const vehicleRef = ref(db, 'vehicles/' + vehicleName);
    const snap = await get(vehicleRef);
    if (!snap.exists()) {
      messageEl.textContent = 'Vehicle not found in database.';
      actionBtn.style.display = 'none';
      return;
    }

    const vehicleData = snap.val();
    if (vehicleData.CurrentlySignedOutBy !== currentUser.email) {
      messageEl.textContent = 'Only the staff member who signed out the vehicle can sign it back in.';
      actionBtn.style.display = 'none';
      await logVehicleAction(vehicleName, 'vehicleReturnDenied', {
        reason: 'signedOutUserMismatch',
        currentlySignedOutBy: vehicleData.CurrentlySignedOutBy || null
      });
      return;
    }

    const maintenanceComment = returnCommentsInput.value.trim();

    await update(vehicleRef, {
      status: 'available',
      CurrentlySignedOutBy: null
    });

    if (maintenanceComment) {
      await update(vehicleRef, {
        maintenanceAlert: true,
        alarm: true
      });
      await logMaintenanceComment(vehicleName, maintenanceComment);
    }

    await logVehicleAction(vehicleName, 'signedIn');

    returnCommentsInput.value = '';
    returnNotesContainer.style.display = 'none';
    messageEl.textContent = `Returned ${vehicleName}.`;
    actionBtn.style.display = 'none';
  }
</script>

</body>
</html>
